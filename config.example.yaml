server:
  listen: "127.0.0.1:8080"
  public_url: "http://192.168.1.x:8080"  # LAN IP:port — used in .strm files so clients can reach the stream directly

tmdb:
  api_key: "YOUR_TMDB_API_KEY"

indexer:
  base_url: "http://127.0.0.1:9696"   # Prowlarr
  api_key: "YOUR_PROWLARR_API_KEY"

torrserver:
  base_url: "http://127.0.0.1:8090"
  # Cache profile applied to TorrServer on startup (omit the whole block to leave
  # TorrServer's own settings untouched).
  cache:
    mode: ram                  # ram | disk
    #   ram  → fastest; needs the RAM headroom (size_mb stays resident)
    #   disk → for low-RAM hosts; writes the bounded cache to an SSD instead of RAM.
    #          REQUIRES path. Auto-deletes the cache file on drop so disk stays flat.
    #          Avoid on Raspberry Pi SD/eMMC flash (wear) — use a small RAM cache or USB SSD.
    size_mb: 2048              # bounded ring buffer; cannot exceed this
    path: ""                   # e.g. /srv/jellyfreedom/cache  (required when mode=disk)
    disconnect_timeout_s: 1800 # idle-torrent keep-alive; higher = instant replay, a little more seeding
    connections_limit: 100     # peer connections; higher = faster buffering
    retrackers_mode: 1         # 0 off, 1 add trackers, 2 replace — 1 speeds cold-start discovery
    upload_rate_limit_kb: 50   # low nonzero; do NOT set 0 (peers choke you, stream stalls)

jellyfin:
  base_url: "http://127.0.0.1:8096"
  api_key: "YOUR_JELLYFIN_API_KEY"    # Dashboard → Advanced → API Keys

library:
  movies_dir: "/srv/jellyfreedom/movies"
  tv_dir: "/srv/jellyfreedom/tv"

picker:
  min_seeders: 5
  prefer_video_codecs: ["h264", "h265", "hevc"]
  prefer_audio_codecs: ["aac", "ac3", "eac3"]
  prefer_containers: ["mp4", "mkv"]
  max_size_gb: 20
