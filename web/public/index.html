<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JellyFreedom</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{
  --bg:#0d0e13;--surface:#13151f;--surface2:#1a1d2a;--border:#252836;
  --text:#e2e4f0;--muted:#5c6080;--muted2:#8890b0;
  --green:#4ade80;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--purple:#a78bfa;--accent:#4f46e5;
  --accent-h:#4338ca;--overlay:rgba(0,0,0,.7)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{display:block}

/* ── Header ─────────────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:50;background:rgba(13,14,19,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0;padding:0 20px;height:56px}
.logo{font-size:16px;font-weight:800;letter-spacing:-.03em;margin-right:28px;
  white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo span{color:var(--accent)}

/* top nav */
.main-nav{display:flex;gap:2px;align-items:center}
.nav-link{padding:6px 14px;border-radius:7px;font-size:14px;font-weight:500;
  color:var(--muted2);cursor:pointer;transition:color .15s,background .15s;border:none;
  background:none;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--surface2)}
.nav-link.active{color:var(--text);background:var(--surface2)}

.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.health-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.health-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.health-dot.err{background:var(--red);box-shadow:0 0 6px var(--red)}

.header-btn{background:none;border:1px solid var(--border);color:var(--muted2);
  padding:6px 12px;border-radius:7px;font-size:13px;text-decoration:none;white-space:nowrap}
.header-btn:hover{border-color:var(--text);color:var(--text)}
.header-btn.signin{border-color:var(--accent);color:var(--accent)}
.header-btn.signin:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.header-user{font-size:13px;color:var(--muted2)}

/* ── Pages ──────────────────────────────────────────────────────────────── */
.page{display:none}
.page.active{display:block}

/* ── Search bar ─────────────────────────────────────────────────────────── */
.search-wrap{max-width:640px;margin:32px auto 28px;padding:0 20px}
.search-box{display:flex;gap:10px}
input[type=search]{flex:1;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:11px 16px;border-radius:10px;font-size:15px;outline:none;
  transition:border .15s}
input[type=search]:focus{border-color:var(--accent)}
.search-box button{background:var(--accent);border:none;color:#fff;padding:11px 20px;
  border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap;transition:background .15s}
.search-box button:hover{background:var(--accent-h)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}

/* ── Carousels ──────────────────────────────────────────────────────────── */
#carousels{padding:0 0 40px}
.carousel-section{margin-bottom:32px}
.carousel-header{display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;margin-bottom:14px}
.carousel-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.carousel-more{font-size:13px;color:var(--accent);cursor:pointer}
.carousel-more:hover{text-decoration:underline}
.carousel-track{display:flex;gap:12px;overflow-x:auto;padding:4px 24px 8px;
  scrollbar-width:none}
.carousel-track::-webkit-scrollbar{display:none}

/* ── Media cards ────────────────────────────────────────────────────────── */
.results{max-width:1400px;margin:0 auto;padding:0 20px 40px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card,.carousel-card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
  aspect-ratio:2/3;border:2px solid transparent;background:var(--surface2);
  transition:transform .18s,border-color .18s,box-shadow .18s;flex-shrink:0}
.carousel-card{width:150px}
.card:hover,.carousel-card:hover{transform:translateY(-5px);border-color:var(--accent);
  box-shadow:0 12px 32px rgba(0,0,0,.6)}
.card.in-library,.carousel-card.in-library{border-color:#166534}
.card.in-library:hover,.carousel-card.in-library:hover{border-color:var(--green)}
.card img,.carousel-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-placeholder,.carousel-card-placeholder{position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:40px}
/* skeleton shimmer */
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* overlay gradient + title */
.card-overlay,.carousel-card-overlay{position:absolute;bottom:0;left:0;right:0;
  padding:32px 10px 10px;
  background:linear-gradient(to bottom,transparent 0%,rgba(8,9,14,.95) 100%)}
.card-title,.carousel-card-title{font-size:12px;font-weight:600;color:#fff;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta,.carousel-card-meta{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;
  display:flex;gap:5px;align-items:center}
/* hover action */
.card-action{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-54%) scale(.85);opacity:0;pointer-events:none;
  background:rgba(79,70,229,.92);color:#fff;font-size:12px;font-weight:600;
  padding:8px 18px;border-radius:7px;white-space:nowrap;backdrop-filter:blur(6px);
  transition:opacity .15s,transform .15s}
.card:hover .card-action,.carousel-card:hover .card-action{opacity:1;transform:translate(-50%,-54%) scale(1)}
.card.in-library .card-action,.carousel-card.in-library .card-action{background:rgba(22,101,52,.92)}
/* status badges */
.badge{font-size:10px;padding:2px 6px;border-radius:7px;font-weight:700;text-transform:uppercase}
.badge.movie{background:rgba(30,58,95,.85);color:var(--blue)}
.badge.tv{background:rgba(59,31,94,.85);color:var(--purple)}
.status-badge{position:absolute;top:7px;left:7px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:9px;backdrop-filter:blur(6px)}
.status-badge.ready{background:rgba(20,83,45,.92);color:var(--green)}
.status-badge.stale{background:rgba(120,53,15,.92);color:var(--yellow)}
/* expired (stale) card: dim the poster + amber ring so it reads as "needs attention" */
.card.is-expired{border-color:rgba(251,191,36,.45)}
.card.is-expired img{opacity:.55;filter:saturate(.7)}
.card.is-expired:hover img{opacity:.75}
/* re-request "previous release" note + highlighted picker row */
.prev-note{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.3);
  border-radius:8px;padding:9px 11px;font-size:12px;color:var(--muted2);
  line-height:1.5;margin-bottom:12px}
.prev-note code{color:var(--blue);font-size:11px;word-break:break-all}
.rel-row.is-prev{background:rgba(251,191,36,.06)}

/* ── Library page ────────────────────────────────────────────────────────── */
#page-library{padding:0 24px 40px}
.library-toolbar{display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 18px;border-bottom:1px solid var(--border);margin-bottom:22px;gap:12px;flex-wrap:wrap}
.library-toolbar h1{font-size:20px;font-weight:700}
.filter-tabs{display:flex;gap:4px;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:3px}
.filter-tab{padding:5px 14px;border-radius:6px;font-size:13px;font-weight:500;
  color:var(--muted2);border:none;background:none;cursor:pointer;transition:all .12s}
.filter-tab.active{background:var(--accent);color:#fff}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.lib-card-wrap{position:relative}
.lib-card-wrap .card{width:100%;aspect-ratio:2/3}
.lib-card-actions{display:flex;gap:6px;margin-top:8px}
/* show card season rings */
.season-rings{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.season-ring{font-size:9px;font-weight:700;color:#0d0e13;border-radius:5px;
  padding:1px 5px;line-height:1.4;min-width:20px;text-align:center}
.show-card .card-overlay{padding-top:40px}
.lib-card-info{margin-top:6px}
.lib-card-title{font-size:12px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lib-card-sub{font-size:11px;color:var(--muted);margin-top:2px}
.btn-sm{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;border:none;
  cursor:pointer;flex:1;transition:background .12s}
.btn-replace{background:var(--surface2);color:var(--muted2);border:1px solid var(--border)}
.btn-replace:hover{background:var(--border);color:var(--text)}
.btn-remove{background:rgba(127,29,29,.5);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-remove:hover{background:rgba(127,29,29,.8)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}
.requester-chip{font-size:10px;color:var(--muted);background:var(--surface);
  border:1px solid var(--border);padding:2px 6px;border-radius:6px;display:inline-block}

/* ── Queue page ─────────────────────────────────────────────────────────── */
.nav-badge{margin-left:6px;background:var(--accent);color:#fff;font-size:10px;
  font-weight:700;padding:1px 6px;border-radius:10px;min-width:16px;
  display:inline-block;text-align:center;vertical-align:middle}
.queue-page-layout{display:flex;gap:24px;padding:22px 24px 40px;max-width:1200px;margin:0 auto}
.queue-sidebar{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
.qs-search input{width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;outline:none}
.qs-search input:focus{border-color:var(--accent)}
.qs-group{display:flex;flex-direction:column;gap:3px}
.qs-group-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:5px}
.qs-filter{text-align:left;background:none;border:none;color:var(--muted2);
  padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;transition:all .12s}
.qs-filter:hover{background:var(--surface2);color:var(--text)}
.qs-filter.active{background:var(--accent);color:#fff;font-weight:600}
.qs-group select{width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;outline:none}
.qs-clear{width:100%;background:none;border:1px solid var(--border);color:var(--muted);
  padding:8px;border-radius:7px;font-size:12px;cursor:pointer}
.qs-clear:hover{border-color:var(--red);color:var(--red)}
.queue-main{flex:1;min-width:0}
.queue-page-header{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;
  padding-bottom:14px;border-bottom:1px solid var(--border)}
.queue-page-header h1{font-size:20px;font-weight:700}
.queue-count-label{font-size:13px;color:var(--muted)}
.queue-bucket{margin-bottom:24px}
.queue-bucket-title{font-size:12px;font-weight:700;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.bucket-dot{width:8px;height:8px;border-radius:50%}
/* shared item row */
.queue-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  margin-bottom:8px;transition:border-color .12s}
.queue-item:hover{border-color:var(--accent)}
.queue-poster{width:44px;height:66px;object-fit:cover;border-radius:5px;
  flex-shrink:0;background:var(--bg);cursor:pointer}
.queue-poster-placeholder{width:44px;height:66px;border-radius:5px;flex-shrink:0;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:16px}
.queue-info{flex:1;min-width:0}
.queue-title{font-size:14px;font-weight:600;line-height:1.3;cursor:pointer}
.queue-title:hover{color:var(--accent)}
.queue-sub{font-size:11px;color:var(--muted);margin-top:2px}
.queue-progress{font-size:11px;color:var(--blue);margin-top:5px;display:flex;align-items:center;gap:5px}
.queue-progress::before{content:'';width:5px;height:5px;border-radius:50%;
  background:var(--blue);animation:pulse 1s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.queue-status{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;font-weight:600}
.qs-pending{color:var(--muted2)}
.qs-processing{color:var(--blue)}
.qs-done{color:var(--green)}
.qs-failed{color:var(--red)}
.qs-cancelled{color:var(--muted)}
.queue-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.queue-action-btn{background:var(--bg);border:1px solid var(--border);color:var(--muted2);
  padding:4px 11px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.queue-action-btn:hover{border-color:var(--text);color:var(--text)}
.queue-action-btn.danger:hover{border-color:var(--red);color:var(--red)}
.queue-action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.queue-action-btn.primary:hover{background:var(--accent-h)}
.queue-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
/* TV season group row */
.season-group{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.season-group-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.season-group-head:hover{background:var(--surface2)}
.sg-summary{flex:1;min-width:0}
.sg-title{font-size:14px;font-weight:600}
.sg-counts{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.sg-count{display:flex;align-items:center;gap:4px}
.sg-count .dot{width:6px;height:6px;border-radius:50%}
.sg-chevron{color:var(--muted);font-size:12px;transition:transform .15s}
.season-group.open .sg-chevron{transform:rotate(90deg)}
.sg-episodes{display:none;border-top:1px solid var(--border);padding:6px 14px 10px}
.season-group.open .sg-episodes{display:block}
.sg-ep{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.sg-ep:last-child{border-bottom:none}
.sg-ep .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sg-ep-num{color:var(--muted);width:34px;flex-shrink:0}
.sg-ep-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sg-ep-status{font-size:10px;font-weight:600}
.sg-ep .queue-action-btn{padding:2px 8px;font-size:10px}

/* ── Modal ──────────────────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(6px)}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;width:100%;max-width:900px;max-height:90vh;overflow-y:auto;padding:24px}
.modal.hidden,.modal-overlay.hidden{display:none}
.modal-close{position:sticky;float:right;top:0;z-index:20;background:rgba(0,0,0,.55);
  border:none;border-radius:50%;color:#fff;font-size:15px;cursor:pointer;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  margin:-6px -6px 0 0;flex-shrink:0}
.modal-close:hover{background:rgba(0,0,0,.85)}
.loading{text-align:center;color:var(--muted);padding:40px;font-size:14px}

/* rich modal header */
.modal-backdrop-wrap{position:relative;margin:-24px -24px 0;border-radius:16px 16px 0 0;
  overflow:hidden;height:300px;flex-shrink:0}
.modal-backdrop{width:100%;height:100%;object-fit:cover;display:block}
.modal-backdrop-fade{position:absolute;bottom:0;left:0;right:0;height:200px;
  background:linear-gradient(to bottom,transparent,var(--surface));pointer-events:none}
.modal-hero{display:flex;gap:18px;position:relative;margin-top:-70px;margin-bottom:16px}
.modal-poster{width:110px;height:165px;object-fit:cover;border-radius:9px;flex-shrink:0;
  background:var(--surface2);border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 28px rgba(0,0,0,.7)}
.modal-meta{flex:1;min-width:0}
.modal-meta h2{font-size:20px;font-weight:700;margin-bottom:3px;line-height:1.2}
.tagline{color:var(--muted2);font-size:12px;font-style:italic;margin-bottom:8px}
.meta-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.meta-chip{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--bg);
  border:1px solid var(--border);color:var(--muted2)}
.copy-link-btn{font-size:11px;padding:3px 9px;border-radius:8px;background:var(--bg);
  border:1px solid var(--border);color:var(--muted2);cursor:pointer}
.copy-link-btn:hover{border-color:var(--accent);color:var(--text)}
/* "← Back" breadcrumb over the backdrop (mirrors the close X on the right) */
.modal-back{position:absolute;top:12px;left:12px;z-index:20;background:rgba(0,0,0,.55);
  border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;
  padding:6px 12px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  backdrop-filter:blur(4px)}
.modal-back:hover{background:rgba(0,0,0,.85)}
.meta-overview{font-size:13px;color:#a0a8c4;line-height:1.55}
/* cast */
.modal-section{margin-bottom:16px}
.modal-section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:10px}
.cast-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cast-strip::-webkit-scrollbar{display:none}
.cast-card{flex-shrink:0;width:64px;text-align:center}
.cast-card img,.cast-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;
  background:var(--surface2);border:1px solid var(--border);display:block;margin:0 auto 5px}
.cast-name{font-size:10px;color:var(--text);line-height:1.2;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cast-char{font-size:9px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* similar / mini strip */
.mini-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.mini-strip::-webkit-scrollbar{display:none}
.mini-card{flex-shrink:0;width:70px;cursor:pointer}
.mini-card img,.mini-thumb{width:70px;height:105px;object-fit:cover;border-radius:6px;
  background:var(--surface2);border:1px solid var(--border);display:block}
.mini-card:hover img,.mini-card:hover .mini-thumb{border-color:var(--accent)}
.mini-card-title{font-size:10px;margin-top:4px;line-height:1.3;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* seasons */
.seasons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.season-item{display:flex;flex-direction:column;gap:4px}
.season-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:9px 6px;border-radius:8px;cursor:pointer;font-size:12px;text-align:center;
  transition:border-color .15s;line-height:1.3}
.season-btn:hover,.season-btn.active{border-color:var(--accent);color:var(--accent)}
.season-req-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);
  padding:5px;border-radius:7px;cursor:pointer;font-size:10px;width:100%;
  transition:border-color .15s}
.season-req-btn:hover{border-color:var(--accent);color:var(--text)}
.season-req-btn:disabled{opacity:.6;cursor:default}
.season-req-btn.done{color:var(--green);border-color:rgba(74,222,128,.35);opacity:1}
.season-req-btn.queued{color:var(--blue);border-color:rgba(96,165,250,.35);opacity:1}
.season-pip{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.season-sub-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);
  padding:4px;border-radius:7px;cursor:pointer;font-size:10px;width:100%;transition:all .15s}
.season-sub-btn:hover{border-color:var(--accent);color:var(--text)}
.season-sub-btn.on{background:rgba(79,70,229,.15);border-color:var(--accent);color:var(--purple);font-weight:600}
.airing-banner{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.3);
  border-radius:9px;padding:10px 13px;font-size:12px;color:var(--muted2);line-height:1.5;margin-bottom:14px}
.airing-banner strong{color:var(--blue)}
/* episodes */
.eps-list{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.ep-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s}
.ep-row:hover,.ep-row.active{border-color:var(--accent)}
.ep-row.ep-st-ready{border-color:rgba(74,222,128,.3)}
.ep-row.ep-st-pending,.ep-row.ep-st-processing{border-color:rgba(96,165,250,.3)}
.ep-row.ep-st-failed{border-color:rgba(248,113,113,.3)}
.ep-row.ep-st-stale{border-color:rgba(251,191,36,.3)}
.ep-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ep-num{font-size:12px;color:var(--muted);width:30px;flex-shrink:0}
.ep-name{font-size:13px;font-weight:500;flex:1}
.ep-date{font-size:11px;color:var(--muted)}
.ep-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.ep-tag.ep-ready{background:rgba(20,83,45,.5);color:var(--green)}
.ep-tag.ep-stale{background:rgba(120,53,15,.5);color:var(--yellow)}
.ep-tag.ep-pending,.ep-tag.ep-processing{background:rgba(30,58,95,.5);color:var(--blue)}
.ep-tag.ep-failed{background:rgba(127,29,29,.5);color:var(--red)}
.ep-chevron{color:var(--muted);font-size:11px;transition:transform .15s}
.ep-row.active .ep-chevron{transform:rotate(90deg);color:var(--accent)}
/* inline episode manage panel (accordion) */
.ep-panel{overflow:hidden}
.ep-panel.open{margin:4px 0 8px}
.ep-inline-panel{background:var(--bg);border:1px solid var(--accent);border-radius:9px;padding:13px}
.ep-inline-head{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ep-inline-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.ep-inline-status .ep-dot{width:7px;height:7px}
.ep-prevnote{font-size:11px;color:var(--muted2);background:rgba(96,165,250,.08);
  border:1px solid rgba(96,165,250,.25);border-radius:7px;padding:7px 10px;margin-bottom:10px}
.ep-inline-actions{display:flex;gap:8px;align-items:stretch}
.ep-remove-btn{background:rgba(127,29,29,.5);border:1px solid rgba(239,68,68,.25);color:var(--red);
  border-radius:9px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ep-remove-btn:hover{background:rgba(127,29,29,.8)}
/* series / season remove buttons */
.series-remove-btn{background:rgba(127,29,29,.4);border:1px solid rgba(239,68,68,.25);color:var(--red);
  border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:14px}
.series-remove-btn:hover{background:rgba(127,29,29,.75)}
.season-remove-btn{background:none;border:1px solid var(--border);color:var(--muted);
  padding:4px;border-radius:7px;cursor:pointer;font-size:10px;width:100%;transition:all .15s}
.season-remove-btn:hover{border-color:var(--red);color:var(--red)}
/* request panel */
.req-panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:16px;margin-bottom:14px}
.req-panel h3{font-size:12px;font-weight:700;margin-bottom:12px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
.lib-select-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lib-select-row label{font-size:12px;color:var(--muted);white-space:nowrap}
select.lib-picker{background:var(--surface);color:var(--text);border:1px solid var(--border);
  padding:6px 10px;border-radius:7px;font-size:12px;flex:1;outline:none}
select.lib-picker:focus{border-color:var(--accent)}
.in-lib-panel{background:#0d1f12;border:1px solid #166534;border-radius:10px;
  padding:14px;margin-bottom:12px}
.in-lib-panel h3{font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.05em}
.digital-warn{background:#78350f22;border:1px solid var(--yellow);border-radius:8px;
  padding:8px 12px;font-size:12px;color:var(--yellow);margin-bottom:10px}
/* req button */
.req-btn{width:100%;background:var(--accent);border:none;color:#fff;padding:13px;
  border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.req-btn:hover:not(:disabled){background:var(--accent-h)}
.req-btn:disabled{opacity:.45;cursor:default}
.req-btn.success{background:#166534;cursor:default}
.req-btn.fail{background:#7f1d1d}
/* release picker */
.picker-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.selected-label{font-size:11px;color:var(--blue);font-family:monospace;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.release-list{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  overflow:hidden;max-height:220px;overflow-y:auto;margin-bottom:10px}
.rel-row{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.rel-row:last-child{border-bottom:none}
.rel-row:hover{background:var(--surface)}
.rel-row.active{background:var(--surface2);border-left:2px solid var(--accent)}
.rel-match{font-size:12px;flex-shrink:0;margin-top:1px}
.rel-title{font-size:11px;flex:1;line-height:1.4;word-break:break-word}
.rel-tags{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0;max-width:120px}
.rel-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface);
  border:1px solid var(--border);font-family:monospace;white-space:nowrap}
/* format chips (result display) */
.format-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.fmt-chip{background:var(--surface);border:1px solid var(--border);padding:4px 10px;
  border-radius:18px;font-size:11px;font-family:monospace}
.fmt-chip.warn{border-color:var(--yellow);color:var(--yellow)}
.fmt-chip.good{border-color:var(--green);color:var(--green)}
.warn-box{background:#78350f22;border:1px solid var(--yellow);border-radius:8px;
  padding:9px 12px;font-size:12px;color:var(--yellow);margin-bottom:12px}

/* login modal */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.login-overlay.hidden{display:none}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:28px 32px;width:320px;max-width:90vw}
.login-box h2{font-size:18px;font-weight:700;margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.login-err{background:#450a0a;color:var(--red);border-radius:7px;padding:8px 12px;
  font-size:13px;margin-bottom:12px;display:none}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);padding:10px 12px;border-radius:7px;font-size:14px;outline:none;
  margin-bottom:10px}
.login-box input:focus{border-color:var(--accent)}
.login-submit{width:100%;background:var(--accent);border:none;color:#fff;padding:11px;
  border-radius:7px;font-size:14px;cursor:pointer;font-weight:600;margin-bottom:8px}
.login-submit:hover{background:var(--accent-h)}
.login-submit:disabled{opacity:.5;cursor:default}
.login-cancel{width:100%;background:none;border:1px solid var(--border);color:var(--muted);
  padding:9px;border-radius:7px;font-size:13px;cursor:pointer}
.login-cancel:hover{border-color:var(--text);color:var(--text)}

/* ── Calendar page ──────────────────────────────────────────────────────── */
.calendar-wrap{max-width:1100px;margin:0 auto;padding:22px 24px 40px}
.calendar-header{display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.calendar-header h1{font-size:20px;font-weight:700}
.cal-controls{display:flex;gap:14px;align-items:center}
.cal-month-nav{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-width:170px;justify-content:center}
.cal-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.cal-nav-btn:hover{background:var(--border)}
.cal-view-toggle{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px}
.cal-view-btn{padding:5px 13px;border-radius:6px;font-size:13px;font-weight:500;
  color:var(--muted2);border:none;background:none;cursor:pointer}
.cal-view-btn.active{background:var(--accent);color:#fff}
/* month grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  text-align:center;padding:4px 0}
.cal-cell{min-height:74px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px;cursor:default;display:flex;flex-direction:column;gap:3px}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.has-items{cursor:pointer}
.cal-cell.has-items:hover{border-color:var(--accent)}
.cal-daynum{font-size:11px;color:var(--muted);font-weight:600}
.cal-cell.today .cal-daynum{color:var(--accent)}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cal-dot{width:6px;height:6px;border-radius:50%}
.cal-dot.movie{background:var(--blue)}
.cal-dot.tv_premiere{background:var(--purple)}
.cal-dot.subscription{background:var(--green)}
.cal-pillrow{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-pill{font-size:9px;line-height:1.3;color:var(--text);background:var(--bg);
  border-radius:3px;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.cal-pill:hover{background:var(--surface2)}
.cal-more{font-size:9px;color:var(--muted)}
.cal-legend{display:flex;gap:16px;margin-top:16px;font-size:12px;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend .cal-dot{width:8px;height:8px}
/* day detail popup */
.cal-day-detail{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.cal-day-detail h3{font-size:14px;font-weight:700;margin-bottom:12px}
/* list view */
.cal-list-section{margin-bottom:22px}
.cal-list-date{font-size:12px;font-weight:700;color:var(--muted2);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cal-list-date .rel{color:var(--accent)}
.cal-entry{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--border);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:border-color .12s}
.cal-entry:hover{border-color:var(--accent)}
.cal-entry-poster{width:40px;height:60px;object-fit:cover;border-radius:5px;flex-shrink:0;background:var(--bg)}
.cal-entry-poster-ph{width:40px;height:60px;border-radius:5px;flex-shrink:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cal-entry-info{flex:1;min-width:0}
.cal-entry-title{font-size:14px;font-weight:600}
.cal-entry-sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:7px}
.cal-kind{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.cal-kind.movie{background:rgba(30,58,95,.6);color:var(--blue)}
.cal-kind.tv_premiere{background:rgba(59,31,94,.6);color:var(--purple)}
.cal-kind.subscription{background:rgba(20,83,45,.6);color:var(--green)}
.cal-empty{text-align:center;padding:50px 20px;color:var(--muted)}

/* toast */
#toast{position:fixed;bottom:22px;right:22px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:300;max-width:280px}
#toast.show{opacity:1}

/* page transition — subtle fade so navigation reads as intentional */
.page.active{animation:pageIn .18s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Responsive (phones / small tablets) ────────────────────────────────── */
@media (max-width: 760px){
  header{padding:0 12px;gap:0;height:52px}
  .logo{margin-right:12px;font-size:15px}
  .main-nav{gap:0}
  .nav-link{padding:6px 9px;font-size:13px}
  .header-right{gap:6px}
  .header-btn{padding:5px 9px;font-size:12px}
  .header-user{display:none !important}        /* save room; name still in menu via Sign out */
  /* tighter media grids → more posters per row on small screens */
  .results,.library-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;padding-left:12px;padding-right:12px}
  .carousel-card{width:116px}
  .carousel-header,.carousel-track{padding-left:14px;padding-right:14px}
  /* queue: sidebar stacks on top as a horizontal scroller */
  .queue-page-layout{flex-direction:column;gap:14px;padding:16px 14px 32px}
  .queue-sidebar{width:100%;flex-direction:row;flex-wrap:wrap;gap:10px;align-items:center}
  .qs-search{flex:1 1 100%}
  .qs-group{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
  .qs-group-title{width:100%;margin-bottom:2px}
  .qs-filter{padding:5px 11px}
  /* calendar: controls wrap, cells shrink */
  .calendar-wrap{padding:16px 12px 32px}
  .calendar-header{align-items:stretch}
  .cal-controls{width:100%;justify-content:space-between}
  .cal-cell{min-height:56px;padding:4px}
  .cal-pill{display:none}                       /* dots only on phones — tap day to expand */
  .cal-legend{flex-wrap:wrap;gap:10px}
  .cal-list-section .cal-entry-poster{width:36px;height:54px}
  /* modal: full-bleed feel on phones */
  .modal-overlay{padding:0;align-items:stretch}
  .modal{max-width:100%;max-height:100vh;border-radius:0}
  .modal-backdrop-wrap{margin:-24px -24px 0;height:210px;border-radius:0}
  .modal-hero{margin-top:-56px}
  .modal-poster{width:88px;height:132px}
  .search-wrap{margin-top:20px}
}
@media (max-width: 420px){
  .results,.library-grid{grid-template-columns:repeat(2,1fr)}
  .nav-link{padding:6px 7px;font-size:12px}
  .logo span{display:inline}
}
</style>
</head>
<body>

<header>
  <div class="logo">🎬 <span>Jelly</span>Freedom</div>
  <nav class="main-nav">
    <button class="nav-link active" data-page="home" onclick="showPage('home')">Home</button>
    <button class="nav-link" data-page="library" onclick="showPage('library')">Library</button>
    <button class="nav-link" data-page="queue" onclick="showPage('queue')">
      Queue<span class="nav-badge" id="queue-badge" style="display:none">0</span>
    </button>
    <button class="nav-link" data-page="calendar" onclick="showPage('calendar')">Calendar</button>
  </nav>
  <div class="header-right">
    <span class="health-dot" id="health-dot" title="Stack health"></span>
    <span class="header-user" id="header-user" style="display:none"></span>
    <button class="header-btn signin" id="header-auth-btn" onclick="openLoginModal(null)">Sign in</button>
    <a class="header-btn" href="/dashboard/">Dashboard</a>
  </div>
</header>

<!-- ── Home page ─────────────────────────────────────────────────────────── -->
<div id="page-home" class="page active">
  <div class="search-wrap">
    <div class="search-box">
      <input type="search" id="q" placeholder="Search movies and TV shows…" autofocus
        onkeydown="if(event.key==='Enter')submitSearch()">
      <button onclick="submitSearch()">Search</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div id="search-results" style="display:none">
    <div class="results" id="results"></div>
  </div>
  <div id="carousels"></div>
</div>

<!-- ── Library page ──────────────────────────────────────────────────────── -->
<div id="page-library" class="page">
  <div class="library-toolbar">
    <h1>My Library</h1>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all" onclick="setLibFilter('all')">All</button>
      <button class="filter-tab" data-filter="movie" onclick="setLibFilter('movie')">Movies</button>
      <button class="filter-tab" data-filter="tv" onclick="setLibFilter('tv')">TV</button>
      <button class="filter-tab" data-filter="mine" onclick="setLibFilter('mine')">Mine</button>
    </div>
  </div>
  <div id="library-grid" class="library-grid"></div>
</div>

<!-- ── Queue page ────────────────────────────────────────────────────────── -->
<div id="page-queue" class="page">
  <div class="queue-page-layout">
    <aside class="queue-sidebar">
      <div class="qs-search">
        <input type="search" id="queue-search" placeholder="Search queue…" oninput="onQueueSearch(this.value)">
      </div>
      <div class="qs-group">
        <div class="qs-group-title">Show</div>
        <button class="qs-filter active" data-grp="status" data-val="all"  onclick="setQueueFilter('status','all',this)">All</button>
        <button class="qs-filter" data-grp="status" data-val="processing" onclick="setQueueFilter('status','processing',this)">In Progress</button>
        <button class="qs-filter" data-grp="status" data-val="failed"     onclick="setQueueFilter('status','failed',this)">Failed</button>
        <button class="qs-filter" data-grp="status" data-val="done"       onclick="setQueueFilter('status','done',this)">Completed</button>
        <button class="qs-filter" data-grp="status" data-val="cancelled"  onclick="setQueueFilter('status','cancelled',this)">Cancelled</button>
      </div>
      <div class="qs-group">
        <div class="qs-group-title">Type</div>
        <button class="qs-filter active" data-grp="type" data-val="all"   onclick="setQueueFilter('type','all',this)">All</button>
        <button class="qs-filter" data-grp="type" data-val="movie"        onclick="setQueueFilter('type','movie',this)">Movies</button>
        <button class="qs-filter" data-grp="type" data-val="tv"           onclick="setQueueFilter('type','tv',this)">TV</button>
      </div>
      <div class="qs-group">
        <div class="qs-group-title">Sort</div>
        <select id="queue-sort" onchange="qSort=this.value;savePrefs();renderQueuePage()">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A–Z</option>
          <option value="status">Status</option>
        </select>
      </div>
      <div class="qs-group">
        <button class="qs-clear" onclick="clearFinishedQueue()">Clear finished</button>
      </div>
    </aside>
    <main class="queue-main">
      <div class="queue-page-header">
        <h1>Request Queue</h1>
        <span id="queue-count-label" class="queue-count-label"></span>
      </div>
      <div id="queue-page-list"><div class="queue-empty">Loading…</div></div>
    </main>
  </div>
</div>

<!-- ── Calendar page ─────────────────────────────────────────────────────── -->
<div id="page-calendar" class="page">
  <div class="calendar-wrap">
    <div class="calendar-header">
      <h1>Release Calendar</h1>
      <div class="cal-controls">
        <div class="cal-month-nav" id="cal-month-nav">
          <button class="cal-nav-btn" onclick="calShiftMonth(-1)">‹</button>
          <span id="cal-month-label"></span>
          <button class="cal-nav-btn" onclick="calShiftMonth(1)">›</button>
        </div>
        <div class="cal-view-toggle">
          <button class="cal-view-btn active" id="cal-view-month" onclick="setCalView('month')">Month</button>
          <button class="cal-view-btn" id="cal-view-list" onclick="setCalView('list')">List</button>
        </div>
      </div>
    </div>
    <div id="calendar-body"><div class="loading">Loading…</div></div>
  </div>
</div>

<!-- ── Modal ─────────────────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- ── Login modal ───────────────────────────────────────────────────────── -->
<div class="login-overlay hidden" id="login-overlay" onclick="if(event.target===this)closeLoginModal()">
  <div class="login-box">
    <h2>Sign in</h2>
    <p class="sub">Sign in to request titles</p>
    <div class="login-err" id="login-err"></div>
    <input type="text" id="login-username" placeholder="Username" autocomplete="username">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')submitLogin()">
    <button class="login-submit" id="login-submit" onclick="submitLogin()">Sign in</button>
    <button class="login-cancel" onclick="closeLoginModal()">Cancel</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
let currentItem = null, currentSeason = null, currentEpisode = null;
let libraries = [], libraryStatus = {}, myLibrary = [];
let currentUser = null, pendingAction = null;
let currentRichDetails = null, selectedMagnet = null;
let forcePicker = false, previousRelease = '';
let queueItems = [];

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  restorePrefs();
  await checkAuth();
  checkHealth();
  setInterval(checkHealth, 30000);
  try { libraries = await fetch('/api/libraries').then(r=>r.json()); } catch(_) {}
  loadMyLibrary();
  loadSubscriptions();
  setInterval(loadMyLibrary, 60000);
  renderCarousels();
  pollQueue();
  setInterval(pollQueue, 4000);

  // Routing + global keyboard shortcuts.
  window.addEventListener('hashchange', () => {
    if (location.hash === renderedRoute) return; // we set it ourselves
    handleRoute();
  });
  document.addEventListener('keydown', onGlobalKey);
  handleRoute(); // render whatever the URL points at on load
}

// Persisted UI preferences (filters/sort/view survive reloads).
function restorePrefs() {
  try {
    const p = JSON.parse(localStorage.getItem('jf_prefs') || '{}');
    if (p.libFilter) libFilter = p.libFilter;
    if (p.qFilterStatus) qFilterStatus = p.qFilterStatus;
    if (p.qFilterType) qFilterType = p.qFilterType;
    if (p.qSort) qSort = p.qSort;
    if (p.calView) calView = p.calView;
  } catch(_) {}
}
function savePrefs() {
  try {
    localStorage.setItem('jf_prefs', JSON.stringify({
      libFilter, qFilterStatus, qFilterType, qSort, calView,
    }));
  } catch(_) {}
}

function onGlobalKey(e) {
  if (e.key === 'Escape') {
    if (!document.getElementById('login-overlay').classList.contains('hidden')) { closeLoginModal(); return; }
    if (!document.getElementById('overlay').classList.contains('hidden')) { closeModal(); return; }
  }
  // "/" focuses search (unless typing in a field)
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName)) {
    e.preventDefault();
    if (currentPage !== 'home') showPage('home');
    setTimeout(() => document.getElementById('q').focus(), 60);
  }
}

// ── Subscriptions ──────────────────────────────────────────────────────────────
async function loadSubscriptions() {
  try { mySubscriptions = await fetch('/api/subscriptions').then(r=>r.json()) || []; }
  catch(_) { mySubscriptions = []; }
}
function findSub(tmdbId, season) {
  return mySubscriptions.find(s => s.TMDBID === tmdbId && s.Season === season) || null;
}
async function toggleSubscription(tmdbId, season, title, poster) {
  if (!currentUser) { openLoginModal(() => toggleSubscription(tmdbId, season, title, poster)); return; }
  const existing = findSub(tmdbId, season);
  try {
    if (existing) {
      await fetch(`/api/subscriptions/${existing.ID}`, {method:'DELETE'});
      toast(`Unsubscribed from ${title} S${season}`);
    } else {
      await fetch('/api/subscriptions', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({tmdb_id: tmdbId, season, title, poster_url: poster||'', library: selectedLibrary()})});
      toast(`Subscribed — new episodes of ${title} S${season} will be grabbed automatically`);
    }
    await loadSubscriptions();
    // Re-render seasons if modal open on this show
    if (currentItem && currentItem.tmdb_id === tmdbId && currentRichDetails) {
      try { const seasons = await fetch(`/api/tmdb/${tmdbId}/seasons`).then(r=>r.json()); renderSeasons(currentRichDetails, seasons); } catch(_) {}
    }
  } catch(e) { toast('Subscription update failed', false); }
}

// ── Routing (hash-based: survives reload, enables back/forward + deep links) ────
let currentPage = 'home';   // underlying page (stays put while a modal is open)
let nextItemOpts = null;    // opts (forcePicker…) consumed by the next item open
let renderedRoute = '␀'; // last hash we rendered, to ignore self-set changes

// Public navigation — just change the URL; handleRoute() does the work.
function showPage(name) { location.hash = name === 'home' ? '' : '#' + name; }
function navItem(type, id, opts) { nextItemOpts = opts || null; location.hash = `#${type}/${id}`; }
function navSearch(q) { location.hash = '#search/' + encodeURIComponent(q); }

// syncHash updates the URL to mirror the current view WITHOUT triggering a re-render.
function syncHash(h) {
  renderedRoute = h;
  if (location.hash !== h && !(h === '' && location.hash === '')) location.hash = h;
}

function setActiveNav(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  const navBtn = document.querySelector(`.nav-link[data-page="${page}"]`);
  if (navBtn) navBtn.classList.add('active');
}

function renderPage(page) {
  currentPage = page;
  setActiveNav(page);
  window.scrollTo({top: 0, behavior: 'auto'});
  if (page === 'library') renderLibraryPage();
  else if (page === 'queue') { pollQueue(); renderQueuePage(); }
  else if (page === 'calendar') loadCalendar();
}

function handleRoute() {
  const raw = location.hash.replace(/^#/, '');
  renderedRoute = location.hash;
  const parts = raw.split('/');
  const head = parts[0] || 'home';

  if (head === 'movie' || head === 'tv') {
    const id = parseInt(parts[1], 10);
    if (!id) { location.hash = ''; return; }
    setActiveNav(currentPage);             // keep the page visible behind the modal
    const opts = nextItemOpts; nextItemOpts = null;
    openItem({tmdb_id: id, media_type: head}, opts || {});
    return;
  }
  closeModalDOM();                          // any page route closes an open modal
  if (head === 'search') {
    renderPage('home');
    const q = decodeURIComponent(parts.slice(1).join('/'));
    document.getElementById('q').value = q;
    if (q) doSearch(); else clearSearch();
    return;
  }
  const page = ['home', 'library', 'queue', 'calendar'].includes(head) ? head : 'home';
  if (page === 'home') { document.getElementById('q').value = ''; clearSearch(); }
  renderPage(page);
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function checkAuth() {
  try {
    const r = await fetch('/api/me');
    currentUser = r.ok ? await r.json() : null;
  } catch(_) { currentUser = null; }
  updateAuthUI();
}

function updateAuthUI() {
  const userEl = document.getElementById('header-user');
  const btn = document.getElementById('header-auth-btn');
  if (currentUser) {
    userEl.textContent = currentUser.username;
    userEl.style.display = '';
    btn.textContent = 'Sign out';
    btn.className = 'header-btn';
    btn.onclick = logout;
  } else {
    userEl.style.display = 'none';
    btn.textContent = 'Sign in';
    btn.className = 'header-btn signin';
    btn.onclick = () => openLoginModal(null);
  }
  const req = document.getElementById('req-btn');
  if (req && !req.disabled) {
    const isEp = req.dataset.action === 'episode';
    req.textContent = currentUser ? (isEp ? 'Request Episode' : 'Request Movie') : 'Sign in to request';
    req.style.opacity = currentUser ? '' : '0.65';
  }
}

function openLoginModal(callback) {
  pendingAction = callback;
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-err').style.display = 'none';
  setTimeout(() => document.getElementById('login-username').focus(), 60);
}
function closeLoginModal() {
  document.getElementById('login-overlay').classList.add('hidden');
  pendingAction = null;
}
async function submitLogin() {
  const btn = document.getElementById('login-submit');
  const errEl = document.getElementById('login-err');
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  errEl.style.display = 'none';
  if (!username || !password) { errEl.textContent = 'Enter username and password'; errEl.style.display = ''; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error||'Login failed'; errEl.style.display = ''; return; }
    currentUser = d;
    closeLoginModal();
    updateAuthUI();
    if (pendingAction) { const fn = pendingAction; pendingAction = null; fn(); }
  } catch(e) { errEl.textContent = 'Login failed'; errEl.style.display = ''; }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}
async function logout() {
  try { await fetch('/api/auth/logout', {method:'POST'}); } catch(_) {}
  currentUser = null; updateAuthUI();
}

async function pollQueue() {
  try {
    const items = await fetch('/api/queue').then(r => r.json());
    queueItems = items || [];
    const pending = queueItems.filter(i => i.Status === 'pending' || i.Status === 'processing').length;
    const badge = document.getElementById('queue-badge');
    if (pending > 0) { badge.textContent = pending; badge.style.display = ''; }
    else { badge.style.display = 'none'; }
    // Live-refresh the queue page if it's the active view.
    if (document.getElementById('page-queue').classList.contains('active')) renderQueuePage();
  } catch(_) {}
}

function setQueueFilter(grp, val, btn) {

  else if (grp === 'type') qFilterType = val;

// Reflect the persisted filter/sort state in the sidebar controls.
