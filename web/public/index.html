function onQueueSearch(v) { qSearch = v.trim().toLowerCase(); renderQueuePage(); }

// Maps a raw item status to a bucket key.
function statusBucket(s) {
  if (s === 'pending' || s === 'processing') return 'processing';
  return s; // done | failed | cancelled
}

const BUCKETS = [
  {key:'processing', label:'In Progress', color:'var(--blue)'},
  {key:'failed',     label:'Failed',      color:'var(--red)'},
  {key:'done',       label:'Completed',   color:'var(--green)'},
  {key:'cancelled',  label:'Cancelled',   color:'var(--muted)'},
];

function renderQueuePage() {
  const host = document.getElementById('page-queue');
  if (!host) return;
  syncQueueControls();
  const list = document.getElementById('queue-page-list');
  const countLabel = document.getElementById('queue-count-label');

  // Build entries: movies are single rows; TV episodes group by (show, season).
  const movies = [];
  const seasonMap = {};
  for (const it of queueItems) {
    if (it.MediaType === 'tv') {
      const key = it.TMDBID + ':' + it.Season;
      let g = seasonMap[key];
      if (!g) g = seasonMap[key] = {kind:'season', tmdbId:it.TMDBID, season:it.Season,
        title:showTitle(it.Title), year:it.Year, poster:it.PosterURL||'', eps:[]};
      g.eps.push(it);
      if (!g.poster && it.PosterURL) g.poster = it.PosterURL;
    } else {
      movies.push({kind:'movie', item:it});
    }
  }
  // Aggregate season status.
  const seasons = Object.values(seasonMap).map(g => {
    let failed=0, active=0, done=0, cancelled=0;
    for (const e of g.eps) {
      const b = statusBucket(e.Status);
      if (b==='failed') failed++; else if (b==='processing') active++;
      else if (b==='done') done++; else cancelled++;
    }
    g.agg = failed ? 'failed' : active ? 'processing' : done ? 'done' : 'cancelled';
    g.counts = {failed, active, done, cancelled, total: g.eps.length};
    return g;
  });

  let entries = [...seasons, ...movies];

  // Filters
  if (qFilterType !== 'all') entries = entries.filter(e => qFilterType === 'tv' ? e.kind==='season' : e.kind==='movie');
  if (qFilterStatus !== 'all') entries = entries.filter(e => (e.kind==='season' ? e.agg : statusBucket(e.item.Status)) === qFilterStatus);
  if (qSearch) entries = entries.filter(e => (e.kind==='season' ? e.title : e.item.Title).toLowerCase().includes(qSearch));

  // Sort
  const titleOf = e => (e.kind==='season' ? e.title : e.item.Title).toLowerCase();
  const timeOf  = e => e.kind==='season'
    ? Math.max(...e.eps.map(x => new Date(x.CreatedAt||0).getTime()))
    : new Date(e.item.CreatedAt||0).getTime();
  const statusRank = e => ['processing','failed','done','cancelled'].indexOf(e.kind==='season'?e.agg:statusBucket(e.item.Status));
  if (qSort === 'az')      entries.sort((a,b)=>titleOf(a).localeCompare(titleOf(b)));
  else if (qSort==='oldest') entries.sort((a,b)=>timeOf(a)-timeOf(b));
  else if (qSort==='status') entries.sort((a,b)=>statusRank(a)-statusRank(b) || timeOf(b)-timeOf(a));
  else entries.sort((a,b)=>timeOf(b)-timeOf(a)); // newest

  const pending = queueItems.filter(i => statusBucket(i.Status)==='processing').length;
  countLabel.textContent = `${queueItems.length} item${queueItems.length===1?'':'s'}${pending?` · ${pending} in progress`:''}`;

  if (!entries.length) {
    list.innerHTML = `<div class="queue-empty">${queueItems.length ? 'No items match these filters.' : 'Queue is empty. Request something to see it here.'}</div>`;
    return;
  }

  // Group entries into status buckets unless a specific status is selected.
  if (qFilterStatus !== 'all') {
    list.innerHTML = entries.map(renderQueueEntry).join('');
    return;
  }
  let html = '';
  for (const b of BUCKETS) {
    const inBucket = entries.filter(e => (e.kind==='season'?e.agg:statusBucket(e.item.Status)) === b.key);
    if (!inBucket.length) continue;
    html += `<div class="queue-bucket">
      <div class="queue-bucket-title"><span class="bucket-dot" style="background:${b.color}"></span>${b.label} (${inBucket.length})</div>
      ${inBucket.map(renderQueueEntry).join('')}
    </div>`;
  }
  list.innerHTML = html;
}

function renderQueueEntry(e) {
  return e.kind === 'season' ? renderSeasonGroup(e) : renderMovieQueueRow(e.item);
}

function renderMovieQueueRow(item) {
  const poster = item.PosterURL
    ? `<img class="queue-poster" src="${esc(item.PosterURL)}" alt="" onclick="navItem('movie',${item.TMDBID})">`
    : `<div class="queue-poster-placeholder">🎬</div>`;
  return `<div class="queue-item">
    ${poster}
    <div class="queue-info">
      <div class="queue-title" onclick="navItem('movie',${item.TMDBID})">${esc(item.Title)}</div>
      <div class="queue-sub">${esc(item.Year||'')} · Movie</div>
      ${queueStatusHTML(item)}
      ${queueRowActions(item)}
    </div>
  </div>`;
}

function queueStatusHTML(item) {
  switch(item.Status) {
    case 'pending':    return `<div class="queue-status qs-pending">⏸ Pending</div>`;
    case 'processing': return `<div class="queue-progress">${esc(item.Progress||'Processing…')}</div>`;
    case 'done':       return `<div class="queue-status qs-done">✓ Done</div>`;
    case 'failed':     return `<div class="queue-status qs-failed">✗ ${esc(item.ErrorMsg||'Failed')}</div>`;
    case 'cancelled':  return `<div class="queue-status qs-cancelled">— Cancelled</div>`;
    default:           return '';
  }
}

function queueRowActions(item) {
  const btns = [];
  if (item.Status === 'pending') btns.push(`<button class="queue-action-btn danger" onclick="cancelQueueItem(${item.ID})">Cancel</button>`);
  if (item.Status === 'failed') {
    btns.push(`<button class="queue-action-btn primary" onclick='retryQueueItem(${item.ID})'>Retry…</button>`);
  }
  if (['done','failed','cancelled'].includes(item.Status))
    btns.push(`<button class="queue-action-btn danger" onclick="deleteQueueItem(${item.ID})">Remove</button>`);
  return btns.length ? `<div class="queue-actions">${btns.join('')}</div>` : '';
}

function renderSeasonGroup(g) {
  const poster = g.poster
    ? `<img class="queue-poster" src="${esc(g.poster)}" alt="">`
    : `<div class="queue-poster-placeholder">📺</div>`;
  const c = g.counts;
  const countBits = [];
  if (c.done)      countBits.push(`<span class="sg-count"><span class="dot" style="background:var(--green)"></span>${c.done} done</span>`);
  if (c.active)    countBits.push(`<span class="sg-count"><span class="dot" style="background:var(--blue)"></span>${c.active} in progress</span>`);
  if (c.failed)    countBits.push(`<span class="sg-count"><span class="dot" style="background:var(--red)"></span>${c.failed} failed</span>`);
  if (c.cancelled) countBits.push(`<span class="sg-count"><span class="dot" style="background:var(--muted)"></span>${c.cancelled} cancelled</span>`);
  const eps = g.eps.slice().sort((a,b)=>a.Episode-b.Episode).map(ep => {
    const b = statusBucket(ep.Status);
    const color = b==='failed'?'var(--red)':b==='processing'?'var(--blue)':b==='done'?'var(--green)':'var(--muted)';
    const label = ep.Status==='processing' ? esc(ep.Progress||'Fetching…')
      : ep.Status==='pending' ? 'Pending' : ep.Status==='done' ? 'Done'
      : ep.Status==='failed' ? esc(ep.ErrorMsg||'Failed') : 'Cancelled';
    const act = [];
    if (ep.Status==='pending') act.push(`<button class="queue-action-btn danger" onclick="event.stopPropagation();cancelQueueItem(${ep.ID})">Cancel</button>`);
    if (ep.Status==='failed') act.push(`<button class="queue-action-btn primary" onclick="event.stopPropagation();retryQueueItem(${ep.ID})">Retry…</button>`);
    if (['done','failed','cancelled'].includes(ep.Status)) act.push(`<button class="queue-action-btn danger" onclick="event.stopPropagation();deleteQueueItem(${ep.ID})">✕</button>`);
    return `<div class="sg-ep">
      <span class="dot" style="background:${color}"></span>
      <span class="sg-ep-num">E${String(ep.Episode).padStart(2,'0')}</span>
      <span class="sg-ep-name">${label}</span>
      ${act.join('')}
    </div>`;
  }).join('');
  return `<div class="season-group" id="sg-${g.tmdbId}-${g.season}">
    <div class="season-group-head" onclick="document.getElementById('sg-${g.tmdbId}-${g.season}').classList.toggle('open')">
      ${poster}
      <div class="sg-summary">
        <div class="sg-title">${esc(g.title)} — Season ${g.season}</div>
        <div class="sg-counts">${countBits.join('')}</div>
      </div>
      <span class="sg-chevron">▶</span>
    </div>
    <div class="sg-episodes">${eps}</div>
  </div>`;
}

async function cancelQueueItem(id) {
  if (!currentUser) { openLoginModal(() => cancelQueueItem(id)); return; }
  await fetch(`/api/queue/${id}/cancel`, {method:'POST'}).catch(()=>{});
  pollQueue();
}
async function deleteQueueItem(id) {
  if (!currentUser) { openLoginModal(() => deleteQueueItem(id)); return; }
  await fetch(`/api/queue/${id}`, {method:'DELETE'}).catch(()=>{});
  pollQueue();
}

// retryQueueItem opens the detail modal with the picker pre-expanded so the user
// can pick a different release rather than silently re-running the failed params.
function retryQueueItem(id) {
  if (!currentUser) { openLoginModal(() => retryQueueItem(id)); return; }
  const q = queueItems.find(x => x.ID === id);
  if (!q) return;
  navItem(q.MediaType, q.TMDBID, {forcePicker: true, previousRelease: ''});
}

async function clearFinishedQueue() {
  if (!currentUser) { openLoginModal(() => clearFinishedQueue()); return; }
  const finished = queueItems.filter(i => ['done','failed','cancelled'].includes(i.Status));
  if (!finished.length) { toast('Nothing to clear'); return; }
  if (!confirm(`Clear ${finished.length} finished item${finished.length===1?'':'s'} from the queue?`)) return;
  for (const i of finished) await fetch(`/api/queue/${i.ID}`, {method:'DELETE'}).catch(()=>{});
  toast(`Cleared ${finished.length} item${finished.length===1?'':'s'}`);
  pollQueue();
}

// ── Calendar ──────────────────────────────────────────────────────────────────
let calData = {entries: [], today: ''};
let calView = 'month';
let calMonth = null;     // Date set to the 1st of the displayed month
let calSelectedDay = ''; // YYYY-MM-DD currently expanded in month view

async function loadCalendar() {
  const body = document.getElementById('calendar-body');
  body.innerHTML = '<div class="loading">Loading releases…</div>';
  try {
    calData = await fetch('/api/calendar').then(r=>r.json()) || {entries:[], today:''};
  } catch(_) { calData = {entries:[], today:''}; }
  if (!calMonth) {
    const t = calData.today ? new Date(calData.today + 'T00:00:00') : new Date();
    calMonth = new Date(t.getFullYear(), t.getMonth(), 1);
  }
  syncCalView();
  renderCalendar();
}

function setCalView(v) {
  calView = v;
  savePrefs();
  syncCalView();
  renderCalendar();
}
function syncCalView() {
  document.getElementById('cal-view-month').classList.toggle('active', calView==='month');
  document.getElementById('cal-view-list').classList.toggle('active', calView==='list');
  document.getElementById('cal-month-nav').style.visibility = calView==='month' ? 'visible' : 'hidden';
}

function calShiftMonth(delta) {
  if (!calMonth) return;
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  calSelectedDay = '';
  renderCalendar();
}

function entriesByDate() {
  const map = {};
  for (const e of calData.entries) (map[e.date] = map[e.date] || []).push(e);
  return map;
}

function renderCalendar() {
  if (calView === 'list') renderCalList();
  else renderCalMonth();
}

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderCalMonth() {
  const label = document.getElementById('cal-month-label');
  label.textContent = `${MONTHS[calMonth.getMonth()]} ${calMonth.getFullYear()}`;
  const byDate = entriesByDate();
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const pad = n => String(n).padStart(2,'0');

  let cells = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i=0; i<firstDow; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let day=1; day<=daysInMonth; day++) {
    const ds = `${year}-${pad(month+1)}-${pad(day)}`;
    const items = byDate[ds] || [];
    const isToday = ds === calData.today;
    const kinds = [...new Set(items.map(i=>i.kind))];
    const dots = kinds.map(k=>`<span class="cal-dot ${k}"></span>`).join('');
    const pills = items.slice(0,2).map(i=>`<div class="cal-pill" onclick="event.stopPropagation();openCalEntry(${i.tmdb_id},'${i.media_type}','${jsStr(i.title)}','${esc(i.poster_url||'')}')">${esc(i.title)}</div>`).join('');
    const more = items.length>2 ? `<div class="cal-more">+${items.length-2} more</div>` : '';
    cells += `<div class="cal-cell ${isToday?'today':''} ${items.length?'has-items':''}"
      ${items.length?`onclick="calShowDay('${ds}')"`:''}>
      <div class="cal-daynum">${day}</div>
      <div class="cal-pillrow">${pills}${more}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }
  const legend = `<div class="cal-legend">
    <span><span class="cal-dot subscription"></span> Subscribed episodes</span>
    <span><span class="cal-dot tv_premiere"></span> TV on air</span>
    <span><span class="cal-dot movie"></span> Upcoming movies</span>
  </div>`;
  const dayDetail = calSelectedDay ? renderCalDayDetail(calSelectedDay, byDate[calSelectedDay]||[]) : '';
  document.getElementById('calendar-body').innerHTML =
    `<div class="cal-grid">${cells}</div>${legend}${dayDetail}`;
}

function calShowDay(ds) {
  calSelectedDay = ds;
  renderCalMonth();
  setTimeout(() => document.querySelector('.cal-day-detail')?.scrollIntoView({behavior:'smooth',block:'nearest'}), 50);
}

function renderCalDayDetail(ds, items) {
  const d = new Date(ds + 'T00:00:00');
  const head = `${DOW[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`;
  return `<div class="cal-day-detail">
    <h3>${head} — ${items.length} release${items.length===1?'':'s'}</h3>
    ${items.map(calEntryRow).join('')}
  </div>`;
}

function renderCalList() {
  const byDate = entriesByDate();
  const dates = Object.keys(byDate).sort();
  if (!dates.length) {
    document.getElementById('calendar-body').innerHTML = `<div class="cal-empty">No upcoming releases found. Subscribe to airing shows to track new episodes here.</div>`;
    return;
  }
  let html = '';
  for (const ds of dates) {
    const d = new Date(ds + 'T00:00:00');
    const rel = relDayLabel(ds);
    const head = `${DOW[d.getDay()]} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
    html += `<div class="cal-list-section">
      <div class="cal-list-date">${head}${rel?` <span class="rel">· ${rel}</span>`:''}</div>
      ${byDate[ds].map(calEntryRow).join('')}
    </div>`;
  }
  document.getElementById('calendar-body').innerHTML = html;
}

function relDayLabel(ds) {
  if (!calData.today) return '';
  const a = new Date(ds+'T00:00:00'), b = new Date(calData.today+'T00:00:00');
  const diff = Math.round((a-b)/86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff > 1 && diff <= 7) return `in ${diff} days`;
  if (diff < 0) return 'aired';
  return '';
}

function calEntryRow(e) {
  const poster = e.poster_url
    ? `<img class="cal-entry-poster" src="${esc(e.poster_url)}" loading="lazy" alt="">`
    : `<div class="cal-entry-poster-ph">${e.media_type==='tv'?'📺':'🎬'}</div>`;
  const kindLabel = e.kind==='subscription'?'Subscribed':e.kind==='tv_premiere'?'TV':'Movie';
  return `<div class="cal-entry" onclick="openCalEntry(${e.tmdb_id},'${e.media_type}','${jsStr(e.title)}','${esc(e.poster_url||'')}')">
    ${poster}
    <div class="cal-entry-info">
      <div class="cal-entry-title">${esc(e.title)}</div>
      <div class="cal-entry-sub">
        <span class="cal-kind ${e.kind}">${kindLabel}</span>
        ${e.subtitle?`<span>${esc(e.subtitle)}</span>`:''}
      </div>
    </div>
  </div>`;
}

function openCalEntry(tmdbId, mediaType) { navItem(mediaType, tmdbId); }

// ── Episode / season status helpers (merge library + queue) ────────────────────
// Returns one of: ready | stale | pending | processing | failed | none
function episodeStatus(tmdbId, season, episode) {
  const lib = myLibrary.find(i => i.TMDBID===tmdbId && i.MediaType==='tv' && i.Season===season && i.Episode===episode);
  if (lib) return lib.Status; // ready | stale
  const q = queueItems.find(x => x.TMDBID===tmdbId && x.Season===season && x.Episode===episode && x.Status!=='cancelled');
  if (q) return q.Status === 'done' ? 'ready' : q.Status;
  return 'none';
}

// Aggregate a season's overall ring status from whatever episodes we know about.
function seasonRingStatus(tmdbId, season) {
  let failed=false, pending=false, stale=false, ready=false;
  for (const i of myLibrary) {
    if (i.TMDBID!==tmdbId || i.MediaType!=='tv' || i.Season!==season) continue;
    if (i.Status==='ready') ready=true; else if (i.Status==='stale') stale=true;
  }
  for (const q of queueItems) {
    if (q.TMDBID!==tmdbId || q.Season!==season) continue;
    if (q.Status==='failed') failed=true;
    else if (q.Status==='pending'||q.Status==='processing') pending=true;
  }
  if (failed) return 'failed';
  if (pending) return 'pending';
  if (stale) return 'stale';
  if (ready) return 'ready';
  return 'none';
}

// Per-season progress against a known total episode count.
function seasonProgress(tmdbId, season, totalEps) {
  const seen = new Set();
  let ready=0, pending=0, failed=0, stale=0;
  for (const i of myLibrary) {
    if (i.TMDBID!==tmdbId || i.MediaType!=='tv' || i.Season!==season) continue;
    seen.add(i.Episode);
    if (i.Status==='ready') ready++; else if (i.Status==='stale') stale++;
  }
  for (const q of queueItems) {
    if (q.TMDBID!==tmdbId || q.Season!==season || seen.has(q.Episode)) continue;
    if (q.Status==='pending'||q.Status==='processing') { pending++; seen.add(q.Episode); }
    else if (q.Status==='failed') { failed++; seen.add(q.Episode); }
  }
  return {ready, pending, failed, stale, requested: seen.size, total: totalEps||0};
}

// ── Search ────────────────────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) { clearSearch(); return; }
  document.getElementById('hint').textContent = 'Searching…';
  document.getElementById('carousels').style.display = 'none';
  document.getElementById('search-results').style.display = '';
  document.getElementById('results').innerHTML = '';
  try {
    const results = await fetch('/search?q=' + encodeURIComponent(q)).then(r=>r.json());
    document.getElementById('hint').textContent = results.length ? `${results.length} results for "${q}"` : 'No results found.';
    renderResultsGrid(document.getElementById('results'), results);
    const ids = results.map(r => r.tmdb_id).join(',');
    if (ids) {
      const statuses = await fetch('/api/library/status?ids=' + ids).then(r=>r.json()).catch(()=>({}));
      for (const [id, info] of Object.entries(statuses)) libraryStatus[parseInt(id)] = info;
      annotateCards(results);
    }
  } catch(e) { document.getElementById('hint').textContent = 'Search failed.'; }
}

function clearSearch() {
  document.getElementById('hint').textContent = '';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('carousels').style.display = '';
}

// Search-as-you-type: debounced, and reflected in the URL via replaceState so it
// survives reload without spamming browser history on every keystroke.
let searchDebounce = null;
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value.trim();
  clearTimeout(searchDebounce);
  if (!v) {
    history.replaceState(null, '', location.pathname + location.search);
    renderedRoute = '';
    clearSearch();
    return;
  }
  searchDebounce = setTimeout(() => {
    doSearch();
    renderedRoute = '#search/' + encodeURIComponent(v);
    history.replaceState(null, '', renderedRoute);
  }, 400);
});

// ── Carousels ─────────────────────────────────────────────────────────────────
function renderCarousels() {
  const container = document.getElementById('carousels');
  container.innerHTML = '';
  for (const c of CAROUSELS) {
    const section = document.createElement('div');
    section.className = 'carousel-section';
    section.id = 'carousel-' + c.id;
    const skeletons = Array(10).fill(null).map(() => {
      return `<div class="carousel-card skeleton" style="aspect-ratio:2/3;width:150px"></div>`;
    }).join('');
    section.innerHTML = `
      <div class="carousel-header">
        <div class="carousel-title">${esc(c.label)}</div>
      </div>
      <div class="carousel-track" id="track-${c.id}">${skeletons}</div>`;
    container.appendChild(section);
    const obs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) { loadCarousel(c); obs.disconnect(); }
    }, {rootMargin: '300px'});
    obs.observe(section);
  }
}

async function loadCarousel(c) {
  const track = document.getElementById('track-' + c.id);
  if (!track) return;
  try {
    const results = await fetch(c.url).then(r => r.json());
    if (!results || !results.length) { track.closest('.carousel-section').style.display = 'none'; return; }
    renderResultsGrid(track, results, true);
    // Check library status for carousel items
    const ids = results.map(r => r.tmdb_id || r.TMDBID).filter(Boolean).join(',');
    if (ids) {
      const statuses = await fetch('/api/library/status?ids=' + ids).then(r=>r.json()).catch(()=>({}));
      for (const [id, info] of Object.entries(statuses)) libraryStatus[parseInt(id)] = info;
    }
  } catch(_) { track.closest('.carousel-section').style.display = 'none'; }
}

// ── Render grids ──────────────────────────────────────────────────────────────
function renderResultsGrid(container, results, isCarousel = false) {
  container.innerHTML = '';
  for (const r of results) {
    const tmdbId = r.tmdb_id || r.TMDBID;
    const mediaType = r.media_type || r.MediaType;
    const title = r.title || r.Title || '';
    const year = r.year || r.Year || '';
    const posterUrl = r.poster_url || r.PosterURL || '';
    const div = document.createElement('div');
    div.className = isCarousel ? 'carousel-card' : 'card';
    div.dataset.tmdbId = tmdbId;
    div.onclick = () => navItem(mediaType, tmdbId);
    const img = posterUrl
      ? `<img src="${esc(posterUrl)}" alt="${esc(title)}" loading="lazy">`
      : `<div class="${isCarousel?'carousel-':''}card-placeholder">🎬</div>`;
    const overlayClass = isCarousel ? 'carousel-card-overlay' : 'card-overlay';
    const titleClass = isCarousel ? 'carousel-card-title' : 'card-title';
    const metaClass = isCarousel ? 'carousel-card-meta' : 'card-meta';
    const actionLabel = mediaType === 'tv' ? '▶ Browse' : '▶ Request';
    div.innerHTML = `${img}
      <div class="${overlayClass}">
        <div class="${titleClass}">${esc(title)}</div>
        <div class="${metaClass}">
          <span>${esc(year)}</span>
          <span class="badge ${mediaType}">${mediaType === 'tv' ? 'TV' : 'Movie'}</span>
        </div>
      </div>
      <div class="card-action">${actionLabel}</div>`;
    container.appendChild(div);
    // Apply existing library status badge immediately
    const info = libraryStatus[tmdbId];
    if (info) applyStatusBadge(div, info);
  }
}

function annotateCards(results) {
  for (const r of results) {
    const info = libraryStatus[r.tmdb_id];
    if (!info) continue;
    const card = document.querySelector(`.card[data-tmdb-id="${r.tmdb_id}"]`) ||
                 document.querySelector(`[data-tmdb-id="${r.tmdb_id}"]`);
    if (card) applyStatusBadge(card, info);
  }
}

function applyStatusBadge(card, info) {
  const old = card.querySelector('.status-badge');
  if (old) old.remove();
  const badge = document.createElement('span');
  badge.className = `status-badge ${info.status}`;
  badge.textContent = info.status === 'ready' ? `✓ ${info.library||'Library'}` : '↻ Stale';
  card.appendChild(badge);
  if (info.status === 'ready') card.classList.add('in-library');
}

// ── Library page ──────────────────────────────────────────────────────────────
// libSkeleton renders shimmer placeholders so the page never flashes empty.
function libSkeleton(n = 12) {
  return Array(n).fill(0).map(() =>
    `<div class="lib-card-wrap"><div class="card skeleton" style="width:100%;aspect-ratio:2/3"></div></div>`).join('');
}

async function renderLibraryPage() {
  syncLibTabs();
  const grid = document.getElementById('library-grid');
  grid.innerHTML = libSkeleton();
  try {
    const viewer = currentUser;
    // Refresh library + queue so season rings reflect in-flight episodes.
    const [items] = await Promise.all([
      fetch('/api/library').then(r=>r.json()).then(x=>x||[]),
      pollQueue(),
    ]);
    myLibrary = items;

    let movies = items.filter(i => i.MediaType === 'movie');
    let shows  = groupShows(items.filter(i => i.MediaType === 'tv'));

    if (libFilter === 'mine' && currentUser) {
      movies = movies.filter(i => i.RequestedBy === currentUser.username);
      shows  = shows.filter(s => s.requesters.has(currentUser.username));
    }

    let html = '';
    if (libFilter === 'all' || libFilter === 'tv' || libFilter === 'mine') {
      html += shows.map(s => renderShowCard(s)).join('');
    }
    if (libFilter === 'all' || libFilter === 'movie' || libFilter === 'mine') {
      html += movies.map(item => renderLibCard(item, viewer)).join('');
    }

    grid.innerHTML = html || `<div class="empty-state"><div class="icon">📚</div><p>Nothing here${libFilter==='mine'?" — you haven't requested anything":''}</p></div>`;
  } catch(e) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">⚠</div><p>Failed to load library</p></div>`;
  }
}

// groupShows collapses flat TV episode rows into one entry per show.
function groupShows(tvItems) {
  const map = {};
  for (const it of tvItems) {
    let g = map[it.TMDBID];
    if (!g) {
      g = map[it.TMDBID] = {
        tmdbId: it.TMDBID, title: showTitle(it.Title), year: it.Year,
        poster: it.PosterURL || '', seasons: new Set(), requesters: new Set(),
        anyStale: false,
      };
    }
    g.seasons.add(it.Season);
    if (it.RequestedBy) g.requesters.add(it.RequestedBy);
    if (it.Status === 'stale') g.anyStale = true;
    if (!g.poster && it.PosterURL) g.poster = it.PosterURL;
  }
  // Stable order: most seasons first, then title.
  return Object.values(map).sort((a,b) => b.seasons.size - a.seasons.size || a.title.localeCompare(b.title));
}

// showTitle strips a trailing " S01E08" from an episode title to get the show name.
function showTitle(t) {
  return String(t||'').replace(/\s*[Ss]\d{1,2}[Ee]\d{1,3}.*$/, '').trim() || t;
}

const RING_COLOR = {ready:'var(--green)', pending:'var(--blue)', stale:'var(--yellow)', failed:'var(--red)', none:'var(--muted)'};

function renderShowCard(show) {
  const poster = show.poster
    ? `<img src="${esc(show.poster)}" alt="${esc(show.title)}" loading="lazy">`
    : `<div class="card-placeholder">📺</div>`;
  const seasons = [...show.seasons].sort((a,b)=>a-b);
  const rings = seasons.map(sn => {
    const st = seasonRingStatus(show.tmdbId, sn);
    return `<span class="season-ring" style="background:${RING_COLOR[st]}" title="Season ${sn}: ${st}">S${sn}</span>`;
  }).join('');
  const badge = show.anyStale ? `<span class="status-badge stale">↻ Expired</span>` : '';
  const actions = canManageShow(show)
    ? `<div class="lib-card-actions">
         <button class="btn-sm btn-remove" onclick="removeSeries(${show.tmdbId},'${jsStr(show.title)}')">Remove series</button>
       </div>` : '';
  return `<div class="lib-card-wrap">
    <div class="card show-card" style="width:100%"
         data-tmdb-id="${show.tmdbId}" data-type="tv"
         data-title="${esc(show.title)}" data-year="${esc(show.year||'')}" data-poster="${esc(show.poster||'')}"
         onclick="openItemFromEl(this)">
      ${poster}
      <div class="card-overlay">
        <div class="card-title">${esc(show.title)}</div>
        <div class="season-rings">${rings}</div>
      </div>
      ${badge}
      <div class="card-action">▶ Manage</div>
    </div>
    ${actions}
  </div>`;
}

function canManageShow(show) {
  if (!currentUser) return false;
  if (currentUser.is_admin || currentUser.isAdmin) return true;
  return show.requesters && show.requesters.has(currentUser.username);
}

async function removeSeries(tmdbId, title) {
  if (!currentUser) { openLoginModal(() => removeSeries(tmdbId, title)); return; }
  if (!confirm(`Remove the entire series "${title}" from your library? You can re-request it afterward.`)) return;
  try {
    const r = await fetch(`/api/library/series/${tmdbId}/drop`, {method:'POST'});
    if (r.status === 401) { currentUser = null; updateAuthUI(); openLoginModal(() => removeSeries(tmdbId, title)); return; }
    const d = await r.json();
    if (!r.ok) { toast(d.error||'Remove failed', false); return; }
    toast(`Removed ${title} (${d.count} episode${d.count===1?'':'s'})`);
    if (currentItem && currentItem.tmdb_id === tmdbId) closeModal();
    await loadMyLibrary();
    renderLibraryPage();
  } catch(e) { toast('Remove failed', false); }
}

async function removeSeason(tmdbId, season) {
  if (!currentUser) { openLoginModal(() => removeSeason(tmdbId, season)); return; }
  if (!confirm(`Remove all of Season ${season} from your library?`)) return;
  try {
    const r = await fetch('/api/library/season/drop', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tmdb_id: tmdbId, season})});
    if (r.status === 401) { currentUser = null; updateAuthUI(); openLoginModal(() => removeSeason(tmdbId, season)); return; }
    const d = await r.json();
    if (!r.ok) { toast(d.error||'Remove failed', false); return; }
    toast(`Removed Season ${season} (${d.count} episode${d.count===1?'':'s'})`);
    await pollQueue(); await loadMyLibrary();
    if (currentItem && currentRichDetails) {
      const seasons = await fetch(`/api/tmdb/${currentItem.tmdb_id}/seasons`).then(r=>r.json());
      renderSeasons(currentRichDetails, seasons);
    }
  } catch(e) { toast('Remove failed', false); }
}

async function removeEpisode(n) {
  if (!currentUser) { openLoginModal(() => removeEpisode(n)); return; }
  const lbl = `S${String(currentSeason).padStart(2,'0')}E${String(n).padStart(2,'0')}`;
  if (!confirm(`Remove ${lbl} from your library?`)) return;
  try {
    const r = await fetch('/api/library/episode/drop', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tmdb_id: currentItem.tmdb_id, season: currentSeason, episode: n})});
    if (r.status === 401) { currentUser = null; updateAuthUI(); openLoginModal(() => removeEpisode(n)); return; }
    if (!r.ok) { const e = await r.json().catch(()=>({error:'failed'})); toast(e.error, false); return; }
    toast(`Removed ${lbl}`);
    await pollQueue(); await loadMyLibrary();
    refreshEpisodeList();
  } catch(e) { toast('Remove failed', false); }
}

function setLibFilter(f) {
  libFilter = f;
  savePrefs();
  syncLibTabs();
  renderLibraryPage();
}
function syncLibTabs() {
  document.querySelectorAll('#page-library .filter-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.filter === libFilter));
}

function canManage(item) {
  if (!currentUser) return false;
  if (currentUser.isAdmin || currentUser.is_admin) return true;
  return item.RequestedBy === currentUser.username;
}

function renderLibCard(item, viewer) {
  const poster = item.PosterURL
    ? `<img src="${esc(item.PosterURL)}" alt="${esc(item.Title)}" loading="lazy">`
    : `<div class="card-placeholder">🎬</div>`;
  const isStale = item.Status === 'stale';
  const statusBadge = `<span class="status-badge ${item.Status}">${isStale ? '↻ Expired' : '✓ Ready'}</span>`;
  const manage = canManage(item);
  // Data attributes (HTML-escaped) carry everything the handlers need — avoids
  // embedding JS object literals in onclick attributes (which breaks on quotes).
  const dataAttrs = `data-tmdb-id="${item.TMDBID}" data-type="${esc(item.MediaType)}"`
    + ` data-title="${esc(item.Title)}" data-year="${esc(item.Year||'')}" data-poster="${esc(item.PosterURL||'')}"`
    + ` data-season="${item.Season||0}" data-episode="${item.Episode||0}"`
    + ` data-hash="${esc(item.InfoHash)}" data-prev="${esc(item.ReleaseTitle||'')}"`;
  let actions = '';
  if (manage) {
    const reqLabel = isStale ? 'Re-request' : 'Replace';
    actions = `
        <button class="btn-sm btn-replace" ${dataAttrs} onclick="event.stopPropagation();rerequestFromEl(this)">${reqLabel}</button>
        <button class="btn-sm btn-remove" data-hash="${esc(item.InfoHash)}" data-title="${esc(item.Title)}" onclick="event.stopPropagation();removeLibItem(this.dataset.hash,this.dataset.title)">Remove</button>`;
  }
  const requesterChip = item.RequestedBy
    ? `<span class="requester-chip">by ${esc(item.RequestedBy)}</span>` : '';
  return `<div class="lib-card-wrap">
    <div class="card${isStale ? ' is-expired' : ''}" style="width:100%" ${dataAttrs} onclick="openItemFromEl(this)">
      ${poster}
      <div class="card-overlay">
        <div class="card-title">${esc(item.Title)}</div>
        <div class="card-meta"><span>${esc(item.Year||'')}</span></div>
      </div>
      ${statusBadge}
    </div>
    <div class="lib-card-info">
      ${requesterChip}
    </div>
    ${manage ? `<div class="lib-card-actions">${actions}</div>` : ''}
  </div>`;
}

// jsStr escapes a string for safe inclusion inside a single-quoted JS string literal in an onclick attribute.
function jsStr(s) {
  return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// elItem builds an item object from a card/button element's data-* attributes.
function elItem(el) {
  return {
    tmdb_id: Number(el.dataset.tmdbId),
    media_type: el.dataset.type,
    title: el.dataset.title || '',
    year: el.dataset.year || '',
    poster_url: el.dataset.poster || '',
    season: Number(el.dataset.season || 0),
    episode: Number(el.dataset.episode || 0),
  };
}
function openItemFromEl(el) { navItem(el.dataset.type, el.dataset.tmdbId); }
function rerequestFromEl(el) {
  if (!currentUser) { openLoginModal(() => rerequestFromEl(el)); return; }
  navItem(el.dataset.type, el.dataset.tmdbId, {forcePicker: true, previousRelease: el.dataset.prev || ''});
}

async function removeLibItem(hash, title) {
  if (!currentUser) { openLoginModal(() => removeLibItem(hash, title)); return; }
  if (!confirm(`Remove "${title}" from library?`)) return;
  try {
    const r = await fetch(`/api/library/${hash}/drop`, {method:'POST'});
    if (r.status === 401) { currentUser = null; updateAuthUI(); openLoginModal(() => removeLibItem(hash, title)); return; }
    if (!r.ok) { const e = await r.json().catch(()=>({error:'failed'})); toast(e.error, false); return; }
    toast(`Removed ${title}`);
    renderLibraryPage();
    loadMyLibrary();
  } catch(e) { toast('Remove failed', false); }
}

async function loadMyLibrary() {
  try {
    const items = await fetch('/api/library').then(r=>r.json());
    myLibrary = items || [];
    libraryStatus = {};
    for (const it of myLibrary) {
      if (!libraryStatus[it.TMDBID] || libraryStatus[it.TMDBID].status !== 'ready') {
        libraryStatus[it.TMDBID] = {status: it.Status, library: it.LibraryName, title: it.Title};
      }
    }
  } catch(_) {}
}

// ── Modal ─────────────────────────────────────────────────────────────────────
// opts: { forcePicker: bool, previousRelease: string }
// openSimilar drills into a related title, remembering the current one so the
// modal can offer a "← Back" breadcrumb.
function openSimilar(type, id) {
  if (currentItem && currentRichDetails) {
    modalStack.push({type: currentItem.media_type, id: currentItem.tmdb_id,
      title: currentRichDetails.title || currentItem.title || ''});
  }
  navItem(type, id);
}

async function openItem(item, opts) {
  opts = opts || {};
  // Reconcile the breadcrumb: if we navigated back to the title on top of the
  // stack (in-modal back OR browser back), pop it.
  if (modalStack.length) {
    const top = modalStack[modalStack.length - 1];
    if (top.id === item.tmdb_id && top.type === item.media_type) modalStack.pop();
  }
  currentItem = item;
  currentSeason = null; currentEpisode = null;
  selectedMagnet = null; currentRichDetails = null;
  forcePicker = !!opts.forcePicker;
  previousRelease = opts.previousRelease || '';
  syncHash(`#${item.media_type}/${item.tmdb_id}`); // mirror in URL (deep-link/back)
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('modal-content').innerHTML = '<div class="loading">Loading…</div>';
  try {
    const details = await fetch(`/api/tmdb/${item.tmdb_id}/full?type=${item.media_type}`).then(r=>r.json());
    currentRichDetails = details;
    // Merge poster_url from local item if TMDB didn't return one
    if (!details.poster_url && item.poster_url) details.poster_url = item.poster_url;
    renderRichModal(details);
  } catch(_) {
    renderFallbackModal(item);
  }
}

// closeModalDOM hides the modal without touching the URL; closeModal navigates back.
function closeModalDOM() {
  document.getElementById('overlay').classList.add('hidden');
  currentItem = currentSeason = currentEpisode = null;
  modalStack = [];
  if (seasonAbort) { seasonAbort.abort(); seasonAbort = null; }
}

// backButtonHTML renders the "← Back" breadcrumb when drilled in via Similar.
function backButtonHTML() {
  if (!modalStack.length) return '';
  const prev = modalStack[modalStack.length - 1];
  const label = prev.title ? `← ${esc(prev.title)}` : '← Back';
  return `<button class="modal-back" onclick="history.back()" title="Back">${label}</button>`;
}
function closeModal() {
  location.hash = currentPage === 'home' ? '' : '#' + currentPage;
}

function renderFallbackModal(item) {
  const inLib = libraryStatus[item.tmdb_id];
  const reqLabel = currentUser ? 'Request Movie' : 'Sign in to request';
  document.getElementById('modal-content').innerHTML = `
    ${backButtonHTML()}
    <h2 style="font-size:20px;font-weight:700;margin-bottom:4px">${esc(item.title)}</h2>
    <p style="color:var(--muted);margin-bottom:16px">${esc(item.year)} · ${item.media_type==='tv'?'TV Series':'Movie'}</p>
    ${inLib&&inLib.status==='ready'?`<div class="in-lib-panel"><h3>✓ In Library — ${esc(inLib.library)}</h3></div>`:''}
    <div class="req-panel">
      ${libSelectHTML('movie')}
      <button class="req-btn" id="req-btn" data-action="movie" style="${currentUser?'':'opacity:.65'}" onclick="requestIt()">${reqLabel}</button>
    </div>`;
}

// ── Rich modal ─────────────────────────────────────────────────────────────────
function richHeaderHTML(d) {
  const hasBackdrop = !!d.backdrop_url;
  const backdrop = hasBackdrop ? `<div class="modal-backdrop-wrap">
    <img class="modal-backdrop" src="${esc(d.backdrop_url)}" alt="">
    <div class="modal-backdrop-fade"></div>
  </div>` : '';
  const poster = d.poster_url
    ? `<img class="modal-poster" src="${esc(d.poster_url)}" alt="${esc(d.title)}">`
    : `<div class="modal-poster" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:32px">🎬</div>`;
  const runtime = d.runtime_minutes ? `${Math.floor(d.runtime_minutes/60)}h ${d.runtime_minutes%60}m` : '';
  const rating  = d.vote_average ? `★ ${d.vote_average.toFixed(1)}` : '';
  const genres  = (d.genres||[]).slice(0,3).join(' · ');
  const chips   = [d.year, runtime, rating, genres].filter(Boolean).map(s=>`<span class="meta-chip">${esc(s)}</span>`).join('');
  const tagline = d.tagline ? `<div class="tagline">${esc(d.tagline)}</div>` : '';
  return `${backdrop}
  <div class="modal-hero" style="${hasBackdrop?'':'margin-top:0'}">
    ${poster}
    <div class="modal-meta">
      <h2>${esc(d.title)}</h2>${tagline}
      <div class="meta-row">${chips}<button class="copy-link-btn" onclick="copyTitleLink()" title="Copy a shareable link to this title">🔗 Copy link</button></div>
      ${d.overview?`<p class="meta-overview">${esc(d.overview)}</p>`:''}
    </div>
  </div>`;
}

function copyTitleLink() {
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => toast('Link copied'), () => toast('Copy failed', false));
  } else {
    // Fallback for non-secure contexts
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Link copied'); } catch(_) { toast('Copy failed', false); }
    document.body.removeChild(ta);
  }
}

function castHTML(cast) {
  if (!cast||!cast.length) return '';
  const items = cast.slice(0,6).map(c => {
    const img = c.profile_url ? `<img src="${esc(c.profile_url)}" loading="lazy" alt="${esc(c.name)}">` : `<div class="cast-avatar"></div>`;
    return `<div class="cast-card">${img}<div class="cast-name">${esc(c.name)}</div><div class="cast-char">${esc(c.character)}</div></div>`;
  }).join('');
  return `<div class="modal-section"><div class="modal-section-title">Cast</div><div class="cast-strip">${items}</div></div>`;
}

function similarHTML(similar, mediaType) {
  if (!similar||!similar.length) return '';
  const items = similar.slice(0,10).map(s => {
    const img = s.poster_url ? `<img src="${esc(s.poster_url)}" loading="lazy" alt="${esc(s.title)}">` : `<div class="mini-thumb"></div>`;
    return `<div class="mini-card" onclick="openSimilar('${s.media_type||mediaType}',${s.tmdb_id})">
      ${img}<div class="mini-card-title">${esc(s.title)}</div></div>`;
  }).join('');
  return `<div class="modal-section"><div class="modal-section-title">Similar</div><div class="mini-strip">${items}</div></div>`;
}

function renderRichModal(d) {
  const inLib = libraryStatus[d.tmdb_id];
  const libHash = (myLibrary.find(i => i.TMDBID === d.tmdb_id && i.Status === 'ready')||{}).InfoHash||'';
  const digitalWarn = (d.media_type==='movie' && !d.digital_release && d.year)
    ? `<div class="digital-warn">⚠ No digital release on record — results may include pre-release fakes</div>` : '';

  let inLibPanel = '';
  if (inLib && inLib.status === 'ready') {
    inLibPanel = `<div class="in-lib-panel">
      <h3>✓ In Library — ${esc(inLib.library)}</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Already in Jellyfin. You can replace it with a different release or remove it.</p>
      <div style="display:flex;gap:8px">
        <button class="req-btn" style="flex:1;background:#1e3a5f;color:var(--blue);font-size:13px;padding:10px" onclick="rerequestMovie()">↻ Replace</button>
        ${libHash ? `<button class="req-btn" style="flex:1;background:#450a0a;color:var(--red);font-size:13px;padding:10px" onclick="removeItem('${libHash}','${esc(d.title)}')">✕ Remove</button>` : ''}
      </div>
    </div>`;
  }

  let reqPanel = '';
  if (d.media_type === 'movie') {
    const reqLabel = currentUser ? (forcePicker ? 'Re-request Movie' : 'Request Movie') : 'Sign in to request';
    const heading = forcePicker ? 'Re-request' : (inLib&&inLib.status==='ready'?'Request to different library':'Request');
    reqPanel = `${forcePicker ? '' : inLibPanel}
    <div class="req-panel">
      <h3>${heading}</h3>
      ${previousReleaseNoteHTML()}
      ${digitalWarn}${libSelectHTML('movie')}
      <div class="picker-row">
        <button class="req-btn" style="flex:none;padding:8px 14px;font-size:12px;background:var(--surface);color:var(--muted2);border:1px solid var(--border)" onclick="toggleReleasePicker()">▾ Choose release</button>
        <span class="selected-label" id="sel-label" style="display:none"></span>
      </div>
      <div id="release-picker-panel" style="display:none"></div>
      <button class="req-btn" id="req-btn" data-action="movie" style="${currentUser?'':'opacity:.65'}" onclick="requestIt()">
        ${reqLabel}
      </button>
    </div>`;
  }

  let html = `${backButtonHTML()}${richHeaderHTML(d)}${castHTML(d.cast)}`;
  if (d.media_type === 'movie') {
    html += similarHTML(d.similar, 'movie') + reqPanel;
  } else {
    html += `<div id="tv-content"><div class="loading">Loading seasons…</div></div>`;
  }
  document.getElementById('modal-content').innerHTML = html;

  // Pre-expand the release picker for re-request / replace flows.
  if (d.media_type === 'movie' && forcePicker) {
    setTimeout(() => toggleReleasePicker(), 60);
  }

  if (d.media_type === 'tv') {
    fetch(`/api/tmdb/${d.tmdb_id}/seasons`)
      .then(r=>r.json())
      .then(seasons => renderSeasons(d, seasons))
      .catch(() => { const tc = document.getElementById('tv-content'); if(tc) tc.innerHTML='<p style="color:var(--red);padding:12px 0">Failed to load seasons.</p>'; });
  }
}

// previousReleaseNoteHTML renders the "Previous: …" hint shown during re-request/replace.
function previousReleaseNoteHTML() {
  if (!forcePicker) return '';
  if (previousRelease) {
    return `<div class="prev-note">Previous: <code>${esc(previousRelease)}</code><br>Pick a different release below, or confirm to re-use.</div>`;
  }
  return `<div class="prev-note">Choose an alternative release below.</div>`;
}

function rerequestMovie() { document.querySelector('.in-lib-panel')?.remove(); }

async function removeItem(hash, title) {
  if (!currentUser) { openLoginModal(() => removeItem(hash, title)); return; }
  if (!confirm(`Remove "${title}" from library?`)) return;
  try {
    const r = await fetch(`/api/library/${hash}/drop`, {method:'POST'});
    if (r.status === 401) { currentUser = null; updateAuthUI(); openLoginModal(() => removeItem(hash, title)); return; }
    if (!r.ok) { const e = await r.json().catch(()=>({error:'failed'})); toast(e.error, false); return; }
    closeModal();
    delete libraryStatus[currentItem ? currentItem.tmdb_id : -1];
    toast(`Removed ${title}`);
    setTimeout(loadMyLibrary, 500);
  } catch(e) { toast('Remove failed', false); }
}

// ── Seasons / episodes ────────────────────────────────────────────────────────
function libSelectHTML(mediaType) {
  const libs = libraries.filter(l => l.type === mediaType);
  if (libs.length <= 1) return '';
  const opts = libs.map(l=>`<option value="${esc(l.name)}" ${l.default?'selected':''}>${esc(l.name)}</option>`).join('');
  return `<div class="lib-select-row"><label>Add to</label><select class="lib-picker" id="lib-picker">${opts}</select></div>`;
}
function selectedLibrary() { const el=document.getElementById('lib-picker'); return el?el.value:''; }

function renderSeasons(item, seasons) {
  const libSel = libSelectHTML('tv');
  const tvContent = document.getElementById('tv-content');
  const tmdbId = currentItem.tmdb_id;
  const d = currentRichDetails || {};
  const airing = !!d.is_airing;
  const showTitleName = d.title || item.title || item.Title || '';
  const showPoster = d.poster_url || item.poster_url || '';
  const airingBanner = airing
    ? `<div class="airing-banner">📡 <strong>Airing</strong> — subscribe to a season below and new episodes are grabbed automatically as they release.</div>`
    : '';
  // "Remove series" — shown when the show has any items in the library.
  const showInLib = myLibrary.some(i => i.TMDBID===tmdbId && i.MediaType==='tv');
  const seriesRemove = (showInLib && currentUser)
    ? `<button class="series-remove-btn" onclick="removeSeries(${tmdbId},'${jsStr(showTitleName)}')">✕ Remove entire series</button>` : '';
  let html = `${airingBanner}${seriesRemove}${libSel?`<div style="margin-bottom:14px">${libSel}</div>`:''}
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">Select a season:</div>
    <div class="seasons-grid">`;
  for (const s of seasons) {
    const total = s.episode_count || 0;
    const p = seasonProgress(tmdbId, s.season_number, total);
    const ringStatus = seasonRingStatus(tmdbId, s.season_number);
    const pip = ringStatus !== 'none'
      ? `<span class="season-pip" style="background:${RING_COLOR[ringStatus]}"></span>` : '';

    // Smart Request-All button state
    const remaining = Math.max(0, total - p.ready - p.pending);
    let btn;
    if (total > 0 && p.ready === total) {
      btn = `<button class="season-req-btn done" disabled>✓ Complete</button>`;
    } else if (remaining === 0 && p.pending > 0) {
      btn = `<button class="season-req-btn queued" disabled>⏳ Queued</button>`;
    } else if (p.requested === 0) {
      btn = `<button class="season-req-btn" id="sreq-${s.season_number}" onclick="requestSeason(${s.season_number},${total},'${jsStr(s.name)}')">↓ Request All</button>`;
    } else {
      btn = `<button class="season-req-btn" id="sreq-${s.season_number}" onclick="requestSeason(${s.season_number},${total},'${jsStr(s.name)}')">↓ Request Remaining (${remaining||'?'})</button>`;
    }

    // Subscription bell — shown for airing shows (or already-subscribed seasons).
    const sub = findSub(tmdbId, s.season_number);
    let bell = '';
    if (airing || sub) {
      bell = `<button class="season-sub-btn${sub?' on':''}" title="${sub?'Unsubscribe':'Auto-grab new episodes'}"
        onclick="toggleSubscription(${tmdbId},${s.season_number},'${jsStr(showTitleName)}','${esc(showPoster)}')">${sub?'🔔 Subscribed':'🔕 Subscribe'}</button>`;
    }

    // Per-season remove — shown when the season has episodes in the library.
    const seasonRemove = ((p.ready + p.stale) > 0 && currentUser)
      ? `<button class="season-remove-btn" onclick="removeSeason(${tmdbId},${s.season_number})">✕ Remove season</button>` : '';

    html += `<div class="season-item">
      <button class="season-btn" data-season="${s.season_number}" onclick="selectSeason(${s.season_number})">
        ${pip}Season ${s.season_number}<br><span style="font-size:10px;color:var(--muted)">${p.ready}/${total||'?'} ready</span>
      </button>
      ${btn}
      ${bell}
      ${seasonRemove}
    </div>`;
  }
  html += `</div><div id="eps-area"></div>`;
  if (tvContent) tvContent.innerHTML = html;
  else document.getElementById('modal-content').innerHTML = `<h2>${esc(item.title||item.Title)}</h2>${html}`;
}

async function selectSeason(n) {
  currentSeason = n; currentEpisode = null;
  document.querySelectorAll('.season-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.season) === n));
  const area = document.getElementById('eps-area');
  area.innerHTML = '<div class="loading">Loading episodes…</div>';
  try {
    const eps = await fetch(`/api/tmdb/${currentItem.tmdb_id}/seasons/${n}/episodes`).then(r=>r.json());
    renderEpisodes(eps);
  } catch(e) { area.innerHTML = '<p style="color:var(--red)">Failed to load episodes.</p>'; }
}

const EP_LABEL = {ready:'Ready', stale:'Expired', pending:'Queued', processing:'Fetching', failed:'Failed', none:''};
let currentEpisodes = [];   // episodes of the open season (for re-render)

function renderEpisodes(eps) {
  currentEpisodes = eps;
  const tmdbId = currentItem.tmdb_id;
  let html = '<div class="eps-list">';
  for (const e of eps) {
    const n = e.episode_number;
    const st = episodeStatus(tmdbId, currentSeason, n);
    const dot = `<span class="ep-dot" style="background:${RING_COLOR[st]}"></span>`;
    const tag = st !== 'none' ? `<span class="ep-tag ep-${st}">${EP_LABEL[st]}</span>` : '';
    // Each row is followed by its own inline manage panel (accordion).
    html += `<div class="ep-row ep-st-${st}" data-ep="${n}" onclick="toggleEpisode(${n},'${jsStr(e.name)}')">
      ${dot}
      <span class="ep-num">E${String(n).padStart(2,'0')}</span>
      <span class="ep-name">${esc(e.name)}</span>
      ${tag}
      <span class="ep-chevron">▸</span>
      <span class="ep-date">${e.air_date?e.air_date.slice(0,4):''}</span>
    </div>
    <div class="ep-panel" id="ep-panel-${n}"></div>`;
  }
  html += '</div>';
  document.getElementById('eps-area').innerHTML = html;
}

// refreshEpisodeList re-renders the open season's episodes (after request/remove),
// keeping the currently-expanded episode open.
function refreshEpisodeList() {
  if (!currentEpisodes.length) return;
  const open = currentEpisode;
  renderEpisodes(currentEpisodes);
  if (open) { const e = currentEpisodes.find(x => x.episode_number === open); if (e) toggleEpisode(open, e.name, true); }
}

// toggleEpisode expands the manage panel directly beneath the clicked row
// (accordion — collapses any other open panel). forceOpen keeps it open on refresh.
function toggleEpisode(n, name, forceOpen) {
  const panel = document.getElementById('ep-panel-' + n);
  if (!panel) return;
  const wasOpen = panel.classList.contains('open');
  // Collapse all
  document.querySelectorAll('.ep-panel').forEach(p => { p.classList.remove('open'); p.innerHTML = ''; });
  document.querySelectorAll('.ep-row').forEach(r => r.classList.remove('active'));
  if (wasOpen && !forceOpen) { currentEpisode = null; return; }
  currentEpisode = n;
  selectedMagnet = null;
  const row = document.querySelector(`.ep-row[data-ep="${n}"]`);
  if (row) row.classList.add('active');
  panel.innerHTML = episodePanelHTML(n, name);
  panel.classList.add('open');
  // For an in-library (re-request) episode, pre-open the picker with its previous release highlighted.
  const lib = myLibrary.find(i => i.TMDBID===currentItem.tmdb_id && i.MediaType==='tv' && i.Season===currentSeason && i.Episode===n);
  if (lib) { previousRelease = lib.ReleaseTitle || ''; setTimeout(() => toggleReleasePicker(), 50); }
  else { previousRelease = ''; }
}

function episodePanelHTML(n, name) {
  const st = episodeStatus(currentItem.tmdb_id, currentSeason, n);
  const inLib = st === 'ready' || st === 'stale';
  const epLbl = `S${String(currentSeason).padStart(2,'0')}E${String(n).padStart(2,'0')}`;
  const reqLabel = !currentUser ? 'Sign in to request' : (inLib ? '↻ Re-request' : 'Request Episode');
  const statusLine = st !== 'none'
    ? `<div class="ep-inline-status ep-${st}"><span class="ep-dot" style="background:${RING_COLOR[st]}"></span> ${EP_LABEL[st]}</div>` : '';
  const removeBtn = (inLib && currentUser)
    ? `<button class="ep-remove-btn" onclick="removeEpisode(${n})">✕ Remove</button>` : '';
  const prevNote = (inLib && currentUser)
    ? `<div class="ep-prevnote">Already in library — pick a different release below, or re-request to refresh.</div>` : '';
  return `<div class="ep-inline-panel">
    <div class="ep-inline-head"><strong>${epLbl}</strong> · ${esc(name)} ${statusLine}</div>
    ${prevNote}
    <div class="picker-row">
      <button class="req-btn" style="flex:none;padding:7px 13px;font-size:12px;background:var(--surface);color:var(--muted2);border:1px solid var(--border)" onclick="toggleReleasePicker()">▾ Choose release</button>
      <span class="selected-label" id="sel-label" style="display:none"></span>
    </div>
    <div id="release-picker-panel" style="display:none"></div>
    <div class="ep-inline-actions">
      <button class="req-btn" id="req-btn" data-action="episode" style="flex:1;${currentUser?'':'opacity:.65'}" onclick="requestIt()">${reqLabel}</button>
      ${removeBtn}
    </div>
  </div>`;
}

// ── Requesting ────────────────────────────────────────────────────────────────
async function requestIt() {
  if (!currentUser) { openLoginModal(() => requestIt()); return; }
  const btn = document.getElementById('req-btn');
  if (!btn) return;
  btn.disabled = true; btn.textContent = 'Adding to queue…';

  const d = currentRichDetails || {};
  const body = {
    tmdb_id: currentItem.tmdb_id,
    type:    currentItem.media_type,
    library: selectedLibrary(),
    title:   d.title || currentItem.title || '',
    year:    d.year  || currentItem.year  || '',
    poster_url: d.poster_url || currentItem.poster_url || '',
  };
  if (currentItem.media_type === 'tv') { body.season = currentSeason; body.episode = currentEpisode; }
  if (selectedMagnet) body.magnet = selectedMagnet;

  try {
    const r = await fetch('/request', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (r.status === 401) {
      currentUser = null; btn.disabled = false; updateAuthUI();
      openLoginModal(() => requestIt()); return;
    }
    const data = await r.json();
    if (!r.ok) { btn.className = 'req-btn fail'; btn.textContent = data.error||'Failed'; btn.disabled = false; return; }
    btn.className = 'req-btn success'; btn.textContent = '✓ Added to queue';
    toast(`"${data.title||'Item'}" added to queue`);
    libraryStatus[currentItem.tmdb_id] = {status:'pending', title: data.title};
    await pollQueue();
    // Reflect the new "queued" state on the episode row, keeping the panel + success button.
    if (currentItem.media_type === 'tv' && currentEpisode) {
      const row = document.querySelector(`.ep-row[data-ep="${currentEpisode}"]`);
      if (row) {
        const dot = row.querySelector('.ep-dot');
        if (dot) dot.style.background = RING_COLOR['pending'];
      }
    }
    setTimeout(loadMyLibrary, 8000);
  } catch(e) {
    btn.className = 'req-btn fail'; btn.textContent = 'Request failed'; btn.disabled = false;
  }
}

async function requestSeason(n, total, name) {
  if (!currentUser) { openLoginModal(() => requestSeason(n, total, name)); return; }
  const btn = document.getElementById(`sreq-${n}`);
  if (btn) { btn.disabled = true; btn.textContent = 'Queuing…'; }
  const d = currentRichDetails || {};
  const body = {
    tmdb_id:    currentItem.tmdb_id,
    season:     n,
    library:    selectedLibrary(),
    title:      d.title || currentItem.title || '',
    year:       d.year  || currentItem.year  || '',
    poster_url: d.poster_url || currentItem.poster_url || '',
  };
  try {
    const r = await fetch('/request/season', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (r.status === 401) { currentUser = null; updateAuthUI(); if(btn){btn.disabled=false;btn.textContent='↓ Request All';} openLoginModal(()=>requestSeason(n,total,name)); return; }
    const data = await r.json();
    if (!r.ok) { if(btn){btn.disabled=false;btn.textContent='↓ Request All';} toast(data.error||'Failed',false); return; }
    if (data.enqueued === 0) {
      toast(`Nothing to request — all ${data.skipped||''} episodes already in library or queue`);
    } else {
      toast(`${data.enqueued} episode${data.enqueued===1?'':'s'} queued for ${name}${data.skipped?` (${data.skipped} already present)`:''}`);
    }
    if (data.subscribed) toast(`🔔 Subscribed — new episodes of ${name} will be grabbed automatically`);
    await pollQueue();
    await loadSubscriptions();
    // Re-render the season list so button states + subscription bell update.
    if (currentItem && currentRichDetails) {
      try {
        const seasons = await fetch(`/api/tmdb/${currentItem.tmdb_id}/seasons`).then(r=>r.json());
        renderSeasons(currentRichDetails, seasons);
      } catch(_) {}
    }
  } catch(e) {
    if(btn){btn.disabled=false;btn.textContent='↓ Request All';}
    toast('Season request failed', false);
  }
}

// ── Release picker ─────────────────────────────────────────────────────────────
async function toggleReleasePicker() {
  const panel = document.getElementById('release-picker-panel');
  if (!panel) return;
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
  panel.style.display = '';
  panel.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:12px">Loading releases…</div>';
  const mt = currentItem.media_type;
  let url = `/api/releases?tmdb_id=${currentItem.tmdb_id}&type=${mt}`;
  if (mt === 'tv' && currentSeason && currentEpisode) url += `&season=${currentSeason}&episode=${currentEpisode}`;
  try {
    const releases = await fetch(url).then(r=>r.json());
    if (!releases||!releases.length) { panel.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:12px">No releases found</div>'; return; }
    let html = '<div class="release-list">';
    for (const r of releases) {
      const matchIcon = r.title_match ? '<span class="rel-match" style="color:var(--green)">✓</span>' : '<span class="rel-match" style="color:var(--red)">✗</span>';
      const isPrev = previousRelease && r.title === previousRelease;
      const prevChip = isPrev ? `<span class="rel-tag" style="border-color:var(--yellow);color:var(--yellow)">previous</span>` : '';
      const camChip = r.is_cam ? `<span class="rel-tag" style="border-color:var(--red);color:var(--red)">⚠ CAM</span>` : '';
      const qualChip = (r.quality && !r.is_cam) ? `<span class="rel-tag" style="border-color:var(--green);color:var(--green)">${esc(r.quality)}</span>` : '';
      const tags = prevChip + camChip + qualChip + [r.video_codec,r.audio_codec,r.container,r.seeders?r.seeders+'s':'',fmtSz(r.size_bytes)].filter(Boolean).map(t=>`<span class="rel-tag">${esc(t)}</span>`).join('');
      const active = r.is_best ? ' active' : '';
      const mag = esc(r.magnet||''); const tit = (r.title||'').replace(/'/g,"\\'");
      html += `<div class="rel-row${active}${isPrev?' is-prev':''}" onclick="selectRelease('${mag}','${tit}',this)">
        ${matchIcon}<span class="rel-title">${esc(r.title)}</span><div class="rel-tags">${tags}</div></div>`;
    }
    panel.innerHTML = html + '</div>';
    const best = releases.find(r => r.is_best);
    if (best) selectRelease(best.magnet, best.title, panel.querySelector('.rel-row.active'));
  } catch(e) { panel.innerHTML = `<div style="padding:10px;color:var(--red);font-size:12px">${esc(e.message)}</div>`; }
}

function selectRelease(magnet, title, rowEl) {
  document.querySelectorAll('.rel-row').forEach(r => r.classList.remove('active'));
  if (rowEl) rowEl.classList.add('active');
  selectedMagnet = magnet;
  const lbl = document.getElementById('sel-label');
  if (lbl) { lbl.textContent = title.length>52?title.slice(0,49)+'…':title; lbl.style.display=''; }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function fmtSz(b) {
  if (!b) return '';
  return b < 1073741824 ? Math.round(b/1048576)+'MB' : (b/1073741824).toFixed(1)+'GB';
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// submitSearch routes through the hash so the query persists across reloads.
function submitSearch() {
  const q = document.getElementById('q').value.trim();
  if (q) navSearch(q); else showPage('home');
}
document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') submitSearch(); });
init();
</script>
