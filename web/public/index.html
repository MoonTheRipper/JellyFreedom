<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="color-scheme" content="dark">
<meta name="description" content="Search and stream movies and TV straight into your Jellyfin library.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JellyFreedom">
<title>JellyFreedom</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header>
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="jf-logo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#aa5cc3"/><stop offset="1" stop-color="#00a4dc"/>
      </linearGradient></defs>
      <circle cx="12" cy="12" r="10" fill="url(#jf-logo)"/>
      <path d="M10 8.2 16.5 12 10 15.8z" fill="#0a0b10"/>
    </svg>
    <span class="logo-text"><span class="grad">Jelly</span>Freedom</span>
  </div>

  <nav class="main-nav" aria-label="Main">
    <button type="button" class="nav-link active" data-page="home" aria-current="page">
      <span class="nav-ico"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg></span>
      <span class="nav-txt">Home</span></button>
    <button type="button" class="nav-link" data-page="library">
      <span class="nav-ico"><svg class="ic" aria-hidden="true"><use href="#i-grid"></use></svg></span>
      <span class="nav-txt">Library</span></button>
    <button type="button" class="nav-link" data-page="queue">
      <span class="nav-ico"><svg class="ic" aria-hidden="true"><use href="#i-list"></use></svg></span>
      <span class="nav-txt">Queue</span>
      <span class="nav-badge" id="queue-badge" hidden>0</span></button>
    <button type="button" class="nav-link" data-page="calendar">
      <span class="nav-ico"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg></span>
      <span class="nav-txt">Calendar</span></button>
  </nav>

  <div class="header-right">
    <div class="health-wrap">
      <button type="button" class="health-dot" id="health-dot"
        aria-label="Stack health" aria-expanded="false" aria-haspopup="dialog"></button>
      <div class="popover" id="health-popover" role="dialog" aria-label="Stack health" hidden></div>
    </div>
    <span class="header-user" id="header-user" hidden></span>
    <button type="button" class="header-btn signin" id="header-auth-btn">Sign in</button>
    <a class="header-btn" id="header-dash-link" href="/dashboard/" hidden>Dashboard</a>
  </div>
</header>

<div class="warn-strip" id="vpn-strip" hidden></div>

<main id="main">

<!-- ── Home ──────────────────────────────────────────────────────────────── -->
<div id="page-home" class="page active">
  <section id="hero" class="hero" aria-label="Featured" hidden></section>

  <div id="setup-banner" class="setup-banner" hidden></div>

  <div class="search-wrap">
    <form class="search-box" id="search-form" role="search">
      <label class="sr-only" for="q">Search movies and TV shows</label>
      <input type="search" id="q" name="q" placeholder="Search movies and TV shows…" autocomplete="off">
      <button type="submit" class="search-submit">
        <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
        <span>Search</span>
      </button>
    </form>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
  </div>

  <div id="search-results" hidden>
    <div class="results" id="results"></div>
  </div>

  <div id="carousels"></div>
</div>

<!-- ── Library ───────────────────────────────────────────────────────────── -->
<div id="page-library" class="page">
  <div class="library-toolbar">
    <h1>My Library</h1>
    <div class="filter-tabs" role="group" aria-label="Filter library">
      <button type="button" class="filter-tab active" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter-tab" data-filter="movie" aria-pressed="false">Movies</button>
      <button type="button" class="filter-tab" data-filter="tv" aria-pressed="false">TV</button>
      <button type="button" class="filter-tab" data-filter="mine" aria-pressed="false">Mine</button>
    </div>
  </div>
  <div id="library-grid" class="library-grid"></div>
</div>

<!-- ── Queue ─────────────────────────────────────────────────────────────── -->
<div id="page-queue" class="page">
  <div class="queue-page-layout">
    <aside class="queue-sidebar" aria-label="Queue filters">
      <div class="qs-search">
        <label class="sr-only" for="queue-search">Search the queue</label>
        <input type="search" id="queue-search" placeholder="Search queue…" autocomplete="off">
      </div>
      <div class="qs-group" role="group" aria-label="Filter by status">
        <div class="qs-group-title">Show</div>
        <button type="button" class="qs-filter active" data-grp="status" data-val="all" aria-pressed="true">All</button>
        <button type="button" class="qs-filter" data-grp="status" data-val="processing" aria-pressed="false">In Progress</button>
        <button type="button" class="qs-filter" data-grp="status" data-val="failed" aria-pressed="false">Failed</button>
        <button type="button" class="qs-filter" data-grp="status" data-val="done" aria-pressed="false">Completed</button>
        <button type="button" class="qs-filter" data-grp="status" data-val="cancelled" aria-pressed="false">Cancelled</button>
      </div>
      <div class="qs-group" role="group" aria-label="Filter by type">
        <div class="qs-group-title">Type</div>
        <button type="button" class="qs-filter active" data-grp="type" data-val="all" aria-pressed="true">All</button>
        <button type="button" class="qs-filter" data-grp="type" data-val="movie" aria-pressed="false">Movies</button>
        <button type="button" class="qs-filter" data-grp="type" data-val="tv" aria-pressed="false">TV</button>
      </div>
      <div class="qs-group">
        <label class="qs-group-title" for="queue-sort">Sort</label>
        <select id="queue-sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A–Z</option>
          <option value="status">Status</option>
        </select>
      </div>
      <div class="qs-group">
        <button type="button" class="qs-clear" id="queue-clear">Clear finished</button>
      </div>
    </aside>
    <div class="queue-main">
      <div class="queue-page-header">
        <h1>Request Queue</h1>
        <span id="queue-count-label" class="queue-count-label" role="status" aria-live="polite"></span>
      </div>
      <div id="queue-page-list"></div>
    </div>
  </div>
</div>

<!-- ── Calendar ──────────────────────────────────────────────────────────── -->
<div id="page-calendar" class="page">
  <div class="calendar-wrap">
    <div class="calendar-header">
      <h1>Release Calendar</h1>
      <div class="cal-controls">
        <div class="cal-month-nav" id="cal-month-nav">
          <button type="button" class="cal-nav-btn" data-cal-shift="-1" aria-label="Previous month">
            <svg class="ic" aria-hidden="true"><use href="#i-chevron-left"></use></svg></button>
          <span id="cal-month-label" role="status" aria-live="polite"></span>
          <button type="button" class="cal-nav-btn" data-cal-shift="1" aria-label="Next month">
            <svg class="ic" aria-hidden="true"><use href="#i-chevron-right"></use></svg></button>
        </div>
        <div class="cal-view-toggle" role="group" aria-label="Calendar view">
          <button type="button" class="cal-view-btn active" data-cal-view="month" aria-pressed="true">Month</button>
          <button type="button" class="cal-view-btn" data-cal-view="list" aria-pressed="false">List</button>
        </div>
      </div>
    </div>
    <div id="calendar-body"></div>
  </div>
</div>

</main>

<!-- ── Detail modal ──────────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="overlay" aria-hidden="true">
  <div class="modal" id="modal" tabindex="-1">
    <button type="button" class="modal-close" id="modal-close" aria-label="Close">
      <svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg>
    </button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- ── Sign-in modal ─────────────────────────────────────────────────────── -->
<div class="login-overlay hidden" id="login-overlay" aria-hidden="true">
  <form class="login-box" id="login-form">
    <h2>Sign in</h2>
    <p class="sub">Sign in to request titles</p>
    <div class="login-err" id="login-err" role="alert" style="display:none"></div>
    <label class="sr-only" for="login-username">Username</label>
    <input type="text" id="login-username" name="username" placeholder="Username"
      autocomplete="username" data-autofocus>
    <label class="sr-only" for="login-password">Password</label>
    <input type="password" id="login-password" name="password" placeholder="Password"
      autocomplete="current-password">
    <button type="submit" class="login-submit" id="login-submit">Sign in</button>
    <button type="button" class="login-cancel" id="login-cancel">Cancel</button>
  </form>
</div>

<noscript>
  <div class="callout err" style="margin:24px">
    <div class="callout-body">
      <div class="callout-title">JellyFreedom needs JavaScript</div>
      <p>This app renders entirely in the browser. Enable JavaScript to search and request titles.</p>
    </div>
  </div>
</noscript>

<script type="module" src="app.js"></script>
</body>
</html>
