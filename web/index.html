<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JellyFreedom</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2d3148;
    --text: #e2e4f0; --muted: #6b7094; --green: #4ade80;
    --red: #f87171; --yellow: #fbbf24; --blue: #60a5fa; --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 'Segoe UI', system-ui, sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px;
    display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .subtitle { color: var(--muted); font-size: 13px; }
  .refresh-btn { margin-left: auto; background: var(--border); border: none; color: var(--text);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: var(--purple); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 24px; max-width: 1400px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-full { grid-column: 1 / -1; }
  .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; }
  .card-header h2 { font-size: 14px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    color: var(--muted); }
  .card-body { padding: 16px 18px; }
  /* services */
  .service-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border); }
  .service-row:last-child { border-bottom: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.failed { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot.inactive { background: var(--muted); }
  .dot.unknown { background: var(--yellow); }
  .svc-name { flex: 1; font-weight: 500; }
  .svc-sub { font-size: 12px; color: var(--muted); }
  .svc-since { font-size: 12px; color: var(--muted); max-width: 200px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .btn { background: var(--border); border: none; color: var(--text); padding: 4px 10px;
    border-radius: 5px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .btn:hover { background: var(--blue); }
  .btn.danger:hover { background: var(--red); }
  /* vpn */
  .vpn-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  .vpn-label { color: var(--muted); font-size: 13px; }
  .vpn-val { font-size: 13px; font-family: monospace; }
  .vpn-val.ok { color: var(--green); }
  .vpn-val.err { color: var(--red); }
  .vpn-configs { margin-top: 14px; }
  .vpn-configs label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  .vpn-switch-row { display: flex; gap: 8px; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 6px; font-size: 13px; flex: 1; }
  /* logs */
  .log-controls { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .log-controls select { flex: 1; }
  pre.log-output { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-size: 12px; font-family: 'Cascadia Code', 'Fira Code', monospace;
    max-height: 320px; overflow-y: auto; color: #c9d1e9; white-space: pre-wrap; word-break: break-all; }
  /* library */
  .lib-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border); }
  .lib-row:last-child { border-bottom: none; }
  .lib-title { flex: 1; font-weight: 500; font-size: 13px; }
  .lib-meta { font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .badge.ready { background: #166534; color: var(--green); }
  .badge.stale { background: #78350f; color: var(--yellow); }
  .badge.error { background: #7f1d1d; color: var(--red); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  /* toast */
  #toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px;
    font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🎬 JellyFreedom</h1>
  <span class="subtitle">Stack Dashboard</span>
  <button class="refresh-btn" onclick="refresh()">↻ Refresh</button>
</header>
<main>
  <div class="card" id="card-services">
    <div class="card-header">
      <h2>Services</h2>
      <button class="btn" onclick="restartAll()">Restart Stack</button>
    </div>
    <div class="card-body" id="services-body"><div class="empty">Loading…</div></div>
  </div>

  <div class="card" id="card-vpn">
    <div class="card-header"><h2>VPN</h2></div>
    <div class="card-body" id="vpn-body"><div class="empty">Loading…</div></div>
  </div>

  <div class="card card-full" id="card-library">
    <div class="card-header">
      <h2>Library</h2>
      <button class="btn danger" onclick="resetTorrents()">Drop All Torrents</button>
    </div>
    <div class="card-body" id="library-body"><div class="empty">Loading…</div></div>
  </div>

  <div class="card card-full" id="card-logs">
    <div class="card-header"><h2>Logs</h2></div>
    <div class="card-body">
      <div class="log-controls">
        <select id="log-svc">
          <option value="jellyfin">jellyfin</option>
          <option value="vpntorrent-netns">vpntorrent-netns</option>
          <option value="torrserver-netns" selected>torrserver-netns</option>
          <option value="prowlarr">prowlarr</option>
          <option value="flaresolverr">flaresolverr</option>
          <option value="jellyfreedom">jellyfreedom</option>
        </select>
        <select id="log-n">
          <option value="40">40 lines</option>
          <option value="80" selected>80 lines</option>
          <option value="200">200 lines</option>
        </select>
        <button class="btn" onclick="fetchLogs()">Load</button>
        <button class="btn" onclick="toggleAutoLog(this)">Auto</button>
      </div>
      <pre class="log-output" id="log-output">Select a service and click Load.</pre>
    </div>
  </div>
</main>
<div id="toast"></div>

<script>
let autoLogTimer = null;

async function apiFetch(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({error: r.statusText})); throw new Error(e.error || r.statusText); }
  return r.json();
}

function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function dotClass(active) {
  if (active === 'active') return 'active';
  if (active === 'failed') return 'failed';
  if (active === 'inactive') return 'inactive';
  return 'unknown';
}

async function fetchStatus() {
  const data = await apiFetch('/api/status');

  // Services
  let html = '';
  for (const s of data.services) {
    const dot = dotClass(s.active);
    const since = s.since ? s.since.replace('CEST', '').replace('CET', '').trim() : '';
    html += `<div class="service-row">
      <span class="dot ${dot}"></span>
      <span class="svc-name">${s.name}</span>
      <span class="svc-sub">${s.sub || ''}</span>
      <span class="svc-since">${since}</span>
      <button class="btn" onclick="restart('${s.name}')">Restart</button>
    </div>`;
  }
  document.getElementById('services-body').innerHTML = html || '<div class="empty">No services</div>';

  // VPN
  const v = data.vpn;
  const connClass = v.connected ? 'ok' : 'err';
  const connText = v.connected ? '✓ Connected' : '✗ Disconnected';
  let vpnHtml = `<div class="vpn-grid">
    <span class="vpn-label">Status</span><span class="vpn-val ${connClass}">${connText}</span>
    <span class="vpn-label">Interface</span><span class="vpn-val">${v.interface || '—'}</span>
    <span class="vpn-label">Endpoint</span><span class="vpn-val">${v.endpoint || '—'}</span>
    <span class="vpn-label">Last handshake</span><span class="vpn-val">${v.handshake_age || '—'}</span>
    <span class="vpn-label">Transfer</span><span class="vpn-val">↓ ${fmtBytes(v.rx_bytes)} ↑ ${fmtBytes(v.tx_bytes)}</span>
    <span class="vpn-label">Active config</span><span class="vpn-val">${v.active_config || '—'}</span>
  </div>`;

  if (v.configs && v.configs.length > 0) {
    const opts = v.configs.map(c =>
      `<option value="${c}" ${c === v.active_config ? 'selected' : ''}>${c}</option>`).join('');
    vpnHtml += `<div class="vpn-configs">
      <label>Switch WireGuard config</label>
      <div class="vpn-switch-row">
        <select id="vpn-config-select">${opts}</select>
        <button class="btn" onclick="switchVPN()">Switch</button>
      </div>
    </div>`;
  }
  document.getElementById('vpn-body').innerHTML = vpnHtml;
}

async function fetchLibrary() {
  const items = await apiFetch('/api/library');
  if (!items || items.length === 0) {
    document.getElementById('library-body').innerHTML = '<div class="empty">No items in library</div>';
    return;
  }
  let html = '';
  for (const item of items) {
    html += `<div class="lib-row">
      <span class="lib-title">${item.Title} <span style="color:var(--muted)">(${item.Year})</span></span>
      <span class="lib-meta">${item.MediaType}</span>
      <span class="lib-meta" style="font-family:monospace">${item.Seeders}s</span>
      <span class="badge ${item.Status}">${item.Status}</span>
      <button class="btn danger" onclick="dropTorrent('${item.InfoHash}', '${item.Title}')">Drop</button>
    </div>`;
  }
  document.getElementById('library-body').innerHTML = html;
}

async function fetchLogs() {
  const svc = document.getElementById('log-svc').value;
  const n = document.getElementById('log-n').value;
  try {
    const data = await apiFetch(`/api/logs?svc=${svc}&n=${n}`);
    document.getElementById('log-output').textContent = (data.lines || []).join('\n');
    const pre = document.getElementById('log-output');
    pre.scrollTop = pre.scrollHeight;
  } catch(e) { toast(e.message, false); }
}

async function restart(svc) {
  try {
    await apiFetch(`/api/services/${svc}/restart`, {method:'POST'});
    toast(`Restarted ${svc}`);
    setTimeout(fetchStatus, 2000);
  } catch(e) { toast(e.message, false); }
}

async function restartAll() {
  for (const svc of ['vpntorrent-netns','torrserver-netns','prowlarr','flaresolverr','jellyfin','jellyfreedom']) {
    try { await apiFetch(`/api/services/${svc}/restart`, {method:'POST'}); } catch(_) {}
    await new Promise(r => setTimeout(r, 500));
  }
  toast('Stack restart initiated');
  setTimeout(refresh, 4000);
}

async function switchVPN() {
  const cfg = document.getElementById('vpn-config-select').value;
  try {
    await apiFetch('/api/vpn/switch', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({config: cfg})});
    toast(`Switched to ${cfg}`);
    setTimeout(fetchStatus, 3000);
  } catch(e) { toast(e.message, false); }
}

async function dropTorrent(hash, title) {
  if (!confirm(`Drop "${title}" and remove from library?`)) return;
  try {
    await apiFetch(`/api/library/${hash}/drop`, {method:'POST'});
    toast(`Dropped ${title}`);
    fetchLibrary();
  } catch(e) { toast(e.message, false); }
}

async function resetTorrents() {
  if (!confirm('Drop ALL torrents and clear the library?')) return;
  const items = await apiFetch('/api/library').catch(() => []);
  for (const item of (items || [])) {
    await apiFetch(`/api/library/${item.InfoHash}/drop`, {method:'POST'}).catch(() => {});
  }
  toast('All torrents dropped');
  fetchLibrary();
}

function toggleAutoLog(btn) {
  if (autoLogTimer) {
    clearInterval(autoLogTimer);
    autoLogTimer = null;
    btn.textContent = 'Auto';
    btn.style.background = '';
  } else {
    fetchLogs();
    autoLogTimer = setInterval(fetchLogs, 5000);
    btn.textContent = 'Auto ●';
    btn.style.background = 'var(--green)';
    btn.style.color = '#000';
  }
}

function fmtBytes(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}

async function refresh() {
  await Promise.all([fetchStatus(), fetchLibrary()]);
}

refresh();
setInterval(fetchStatus, 30000);
</script>
</body>
</html>
